    '<span class="chip">' + esc(labelOf([["GENERATES","Génère des revenus"],["CONSUMES","Consomme de la trésorerie"],["NEUTRAL","Neutre"]], a.incomeGenerating)) + "</span>" +
    '<span class="chip">' + esc(labelOf([["APPRECIATING","Prend de la valeur"],["DEPRECIATING","Perd de la valeur"],["STABLE","Stable"],["UNKNOWN","Tendance inconnue"]], a.appreciation)) + "</span>" +
    '<span class="chip">' + esc(labelOf([["LIQUID","Liquide"],["SEMI_LIQUID","Semi-liquide"],["ILLIQUID","Illiquide"]], a.liquidity)) + "</span>" +
    '<span class="chip">' + (a.role === "INVESTMENT" ? "Investissement" : "Bien personnel") + "</span>" +
    '<span class="chip">' + esc(labelOf([["CASH","Fonds propres"],["LOAN","Crédit"],["MIXED","Mixte"]], a.financingMode)) + "</span>" +
    "</div>" +

    (vals.length ? vals.map(function(v){
      return "<tr><td>" + fmtDate(v.date) + '</td><td class="r nowrap"><b>' + fmtMoney(v.value, v.currency || cur) + '</b></td><td class="r">' + fmtMoney(v.valueBase, "") + "</td><td>" + esc(v.note || "—") + "</td></tr>";
    }).join("") : '<tr><td colspan="4" class="empty">Aucune valorisation.</td></tr>') + "</tbody></table></div>" +

    }).join("") : '<tr><td colspan="4" class="empty">Aucun flux lié.</td></tr>') + "</tbody></table></div>";

function openAssetManageMenu(a){
  var body = fSelect("status", "Statut", [{ v: "ACTIVE", l: "Actif" }, { v: "SOLD", l: "Vendu" }, { v: "ARCHIVED", l: "Archivé" }], a.status) +
    (a.status === "SOLD" || true ? '<div class="frow">' + fInput("soldPrice", "Prix de vente (si vendu)", "number", a.soldPrice != null ? a.soldPrice : "", { step: "any" }) + fInput("soldDate", "Date de vente", "date", a.soldDate || "") + "</div>" : "") +
    '<div class="row-actions" style="margin-top:10px"><button class="btn btn-s btn-x" id="amEdit">Modifier la fiche</button>' +
    (DB.transactions.some(function(t){ return t.assetId === a.id; }) || DB.valuations.some(function(v){ return v.assetId === a.id; }) ? "" : '<button class="btn btn-d btn-x" id="amDel">Supprimer</button>') + "</div>";
  openModal("Gérer — " + a.name, body);
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: "Enregistrer le statut", onClick: function(){
      var st = gv("status");
      a.status = st;
      a.soldPrice = gv("soldPrice") ? gn("soldPrice") : null;
      a.soldDate = st === "SOLD" && gv("soldDate") ? gv("soldDate") : null;
      saveDB(); closeModal(); rerender();
      toast("Statut de l'actif mis à jour.");
    }}
  ]);
  var ed = document.getElementById("amEdit");
  if (ed) ed.onclick = function(){ closeModal(); openAssetModal(a); };
  var del = document.getElementById("amDel");
  if (del) del.onclick = function(){
    if (!confirm("Supprimer définitivement cet actif et ses valorisations ?")) return;
    DB.assets = DB.assets.filter(function(x){ return x.id !== a.id; });
    DB.valuations = DB.valuations.filter(function(v){ return v.assetId !== a.id; });
    saveDB(); closeModal(); rerender();
    toast("Actif supprimé.");
  };
}

function openValuationModal(a){
  var body = '<p class="note" style="margin-top:0">Nouvelle entrée d\'historique — l\'ancienne valorisation est conservée.</p>' +
    '<div class="frow">' + fInput("value", "Valeur actuelle (" + a.currency + ")", "number", "", { step: "any", required: true }) +
    fInput("date", "Date de valorisation", "date", todayISO(), { required: true }) + "</div>" +
    fTextarea("note", "Note (source de l'estimation)", "", { placeholder: "Ex. estimation agent immobilier, cote du marché…" });
  openModal("Réévaluer — " + a.name, body);
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: "Enregistrer la valorisation", onClick: function(){
      var value = gn("value");
      if (!(value > 0) && value !== 0){ toast("Valeur invalide.", "err"); return; }
      var date = gv("date") || todayISO();
      var rate = rateFor(a.currency, Date.parse(date), false);
      if (rate == null){ toast("Aucun taux connu pour " + a.currency + ". Ajoutez-le dans Paramètres → Taux.", "err"); return; }
      DB.valuations.push({ id: uid(), assetId: a.id, date: date, value: value, currency: a.currency, rateApplied: rate, valueBase: toBase(value, rate), note: gv("note") || "Réévaluation" });
      saveDB(); closeModal(); rerender();
      toast("Valorisation enregistrée dans l'historique.");
    }}
  ]);
}

function openLiabilityDetail(id){

  var pays = DB.payments.filter(function(p){ return p.liabilityId === id; }).sort(function(a,b){ return Date.parse(b.date) - Date.parse(a.date); });
  var sched = amortizationOf(l);
  var cur = l.currency;
  var body =
    '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">' +
    kpi("Montant initial", fmtMoney(l.initialAmount, cur, 0), "") +
    kpi("Capital restant dû", fmtMoney(info.remaining, cur, 0), "", "neg") +
    kpi("Capital remboursé", fmtMoney(info.capitalPaid, cur, 0), fmtPct(info.progress), "pos") +
    kpi("Intérêts payés", fmtMoney(info.interestPaid, cur, 0), "Charges financières", "warn") +
    kpi("Frais payés", fmtMoney(info.feesPaid, cur, 0), "", "warn") +
    "</div>" +
    '<div class="alert a-warn">Le capital remboursé réduit le passif sans être une dépense de consommation. Seuls les intérêts et frais sont des charges financières.</div>' +
    '<div class="section-title">Historique des paiements</div><div class="tw"><table><thead><tr><th>Date</th><th class="r">Capital</th><th class="r">Intérêts</th><th class="r">Frais</th><th>Compte débité</th><th></th></tr></thead><tbody>' +
    (pays.length ? pays.map(function(p){
      var acc = accountById(p.accountId);
      return "<tr><td>" + fmtDate(p.date) + '</td><td class="r pos">' + fmtMoney(p.capital, cur, 0) + '</td><td class="r warn">' + fmtMoney(p.interest, cur, 0) + '</td><td class="r">' + fmtMoney(p.fees, cur, 0) + "</td><td>" + (acc ? esc(acc.name) : "—") +
        '</td><td><button class="link d" data-pay="' + p.id + '">Suppr.</button></td></tr>';
    }).join("") : '<tr><td colspan="6" class="empty">Aucun paiement enregistré.</td></tr>') + "</tbody></table></div>" +
    '<div class="section-title">Échéancier théorique</div>' +
    (sched.note ? '<p class="note">' + esc(sched.note) + "</p>" : '<div class="tw" style="max-height:260px;overflow-y:auto"><table><thead><tr><th>#</th><th>Date</th><th class="r">Intérêts</th><th class="r">Capital</th><th class="r">Restant dû</th></tr></thead><tbody>' +
      sched.rows.map(function(r){
        return "<tr><td>" + r.i + "</td><td>" + fmtDate(r.date) + '</td><td class="r warn">' + fmtMoney(r.interest, cur, 0) + "</td><td class=\"r\">" + fmtMoney(r.capital, cur, 0) + '</td><td class="r"><b>' + fmtMoney(r.remaining, cur, 0) + "</b></td></tr>";
      }).join("") + "</tbody></table></div>");
  openModal(l.name + " — " + l.creditor, body, { wide: true });
  document.querySelectorAll("button[data-pay]").forEach(function(b){
    b.onclick = function(){
      if (!confirm("Supprimer ce paiement ? Les soldes seront recalculés.")) return;
      DB.payments = DB.payments.filter(function(p){ return p.id !== b.dataset.pay; });
      saveDB(); closeModal(); rerender();
      toast("Paiement supprimé.");
    };
  });
  modalFooter([
    { label: "Fermer", variant: "s", onClick: closeModal },
    { label: "Modifier", variant: "s", onClick: function(){ closeModal(); openLiabilityModal(l); } },
    { label: "+ Paiement", onClick: function(){ closeModal(); openPaymentModal(l); } }
  ]);
}

function openPaymentModal(l){
  var accs = activeAccounts().filter(function(a){ return a.currency === l.currency; });
  var accOpts = [{ v: "", l: "— Aucun (hors caisse) —" }].concat(accs.map(function(a){ return { v: a.id, l: a.name }; }));
  var body = '<div class="frow">' +
    fInput("capital", "Capital remboursé (" + l.currency + ")", "number", "", { step: "any", hint: "Réduit la dette — pas une dépense de consommation." }) +
    fInput("interest", "Intérêts payés (" + l.currency + ")", "number", "", { step: "any", hint: "Charges financières." }) +
    fInput("fees", "Frais payés (" + l.currency + ")", "number", "", { step: "any" }) +
    fInput("date", "Date", "date", todayISO(), { required: true }) +
    "</div>" +
    fSelect("accountId", "Compte débité", accOpts, accs.length ? accs[0].id : "", { hint: "Le total (capital + intérêts + frais) sera débité de ce compte." }) +
    fTextarea("notes", "Notes", "");
  openModal("Paiement — " + l.name, body);
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: "Enregistrer le paiement", onClick: function(){
      var capital = gn("capital") || 0, interest = gn("interest") || 0, fees = gn("fees") || 0;
      var total = capital + interest + fees;
      if (total <= 0){ toast("Le paiement doit comprendre au moins un montant.", "err"); return; }
      var date = gv("date") || todayISO();
      var rate = rateFor(l.currency, Date.parse(date), false);
      if (rate == null){ toast("Aucun taux connu pour " + l.currency + ". Ajoutez-le dans Paramètres → Taux.", "err"); return; }
      var accountId = gv("accountId") || null;
      if (accountId && accountById(accountId).currency !== l.currency){ toast("Le compte doit être dans la devise du passif (" + l.currency + ").", "err"); return; }
      DB.payments.push({ id: uid(), liabilityId: l.id, date: date, capital: capital, interest: interest, fees: fees, currency: l.currency, rateApplied: rate, accountId: accountId, notes: gv("notes") || null });
      if (liabilityRemaining(l.id, Date.now()) <= 0.005){
        l.status = "CLOSED";
        toast("Capital totalement remboursé : passif clôturé automatiquement.");
      } else toast("Paiement enregistré.");
      saveDB(); closeModal(); rerender();
    }}
  ]);
}

    '<div class="alert a-warn">⚠ Pensez à télécharger régulièrement votre <b>sauvegarde JSON</b> (Paramètres → Sauvegarde) : les données vivent dans ce navigateur.</div>' + controls + "</div></div>";
  function periodWrap(){
    var w = document.getElementById("repPeriodWrap");
    if (repState.type === "monthly")
      w.innerHTML = '<span class="lab">Mois</span><input type="month" id="repMonth" value="' + esc(repState.month) + '" style="width:auto">';
    else
      w.innerHTML = '<span class="lab">Année</span><input type="number" id="repYear" value="' + repState.year + '" min="1990" max="2100" style="width:auto">';
    var m = document.getElementById("repMonth");
    if (m) m.onchange = function(e){ repState.month = e.target.value; };
    var y = document.getElementById("repYear");
    if (y) y.onchange = function(e){ repState.year = +e.target.value; };
  }
  periodWrap();
  document.getElementById("repType").onchange = function(e){ repState.type = e.target.value; RENDER.reports(); };
  document.getElementById("repGen").onclick = function(){ generateReport(); };
  document.getElementById("repJson").onclick = function(){ if (repState.last) download("pwm-rapport-" + (repState.lastKind === "monthly" ? repState.last.ym : repState.last.year) + ".json", JSON.stringify(repState.last, null, 2), "application/json"); };
  document.getElementById("repCsv").onclick = function(){ exportReportCsv(); };
  document.getElementById("repPrint").onclick = function(){ window.print(); };
  if (repState.last) showReport(repState.last, repState.lastKind);
  else generateReport();

  function generateReport(){
    if (repState.type === "monthly"){
      if (!/^\d{4}-\d{2}$/.test(repState.month)){ toast("Mois invalide.", "err"); return; }
      repState.last = reportMonthly(repState.month);
    } else {
      if (!repState.year || repState.year < 1900){ toast("Année invalide.", "err"); return; }
      repState.last = reportAnnual(repState.year);
    }
    repState.lastKind = repState.type;
    showReport(repState.last, repState.lastKind);
  }
  function exportReportCsv(){
    if (!repState.last) return;
    var r = repState.last, rows = [];
    if (repState.lastKind === "monthly"){
      var r = repState.last;
      rows = [["Indicateur", "Valeur (" + DB.settings.baseCurrency + ")"],
        ["Total actifs", r.bilan.totalAssets], ["Total passifs", r.bilan.totalLiabilities], ["Patrimoine net consolidé", r.bilan.netWorth],
        ["Comptes de trading", r.bilan.tradingValue], ["Liquidités", r.bilan.cashAll],
        ["Revenus du mois", r.flows.income], ["Dont revenus passifs", r.flows.passive],
        ["Dépenses de consommation", r.flows.expense], ["Charges financières", r.flows.charges], ["Capital remboursé", r.flows.capitalRepaid],
        ["Décaissements totaux", r.flows.cashOut], ["Cash-flow net", r.flows.net],
        ["Patrimoine net mois précédent", r.bilanPrev.netWorth], ["Δ Patrimoine net", r.deltas.netWorth]];
      r.flows.byCatIn.forEach(function(c){ rows.push(["Revenu — " + catLabel("INCOME", c[0]), c[1]]); });
      r.flows.byCatOut.forEach(function(c){ rows.push(["Dépense — " + catLabel("EXPENSE", c[0]), c[1]]); });
    } else {
      rows = [["Indicateur", "Valeur (" + DB.settings.baseCurrency + ")"],
        ["Année", r.year],
        ["Patrimoine net au début", r.start.netWorth], ["Patrimoine net à la fin", r.end.netWorth],
        ["Croissance", roundMoney(r.end.netWorth - r.start.netWorth, 2)],
        ["Total actifs (fin)", r.end.totalAssets], ["Total passifs (fin)", r.end.totalLiabilities],
        ["Revenus de l'année", r.flows.income], ["Dont revenus passifs", r.flows.passive],
        ["Dépenses de consommation", r.flows.expense], ["Charges financières", r.flows.charges],
        ["Capital remboursé", r.flows.capitalRepaid], ["Cash-flow net", r.flows.net],
        ["Capital remboursé (paiements)", r.repaid], ["Intérêts + frais payés", r.interestPaid]];
      r.series.labels.forEach(function(label, i){
        rows.push(["Mois " + label + " — revenus", r.series.income[i]]);
        rows.push(["Mois " + label + " — dépenses", r.series.expenses[i]]);
        rows.push(["Mois " + label + " — patrimoine net", r.series.netWorth[i]]);
      });
    }
    downloadCSV("pwm-rapport-" + (repState.lastKind === "monthly" ? r.ym : r.year) + ".csv", rows);
  }
  function showReport(r, kind){
    var area = document.getElementById("repArea");
    var base = DB.settings.baseCurrency;
    if (kind === "monthly"){
      var f = r.flows;
      area.innerHTML = '<div class="grid2">' +
        '<div class="card"><div class="card-h"><h3>Bilan patrimonial — ' + fmtDate(r.ym + "-01") + "</h3></div><div class=\"card-b\">" +
        repRow("Total des actifs", fmtMoney(r.bilan.totalAssets, base, 0)) +
        repRow("Total des passifs", fmtMoney(r.bilan.totalLiabilities, base, 0)) +
        repRow("Patrimoine net consolidé", fmtMoney(r.bilan.netWorth, base, 0), "accent") +
        repRow("Comptes de trading (valeur nette)", fmtMoney(r.bilan.tradingValue, base, 0)) +
        repRow("Liquidités", fmtMoney(r.bilan.cashAll, base, 0)) +
        '<div class="section-title">Comparaison avec le mois précédent</div>' +
        repRow("Patrimoine net précédent", fmtMoney(r.bilanPrev.netWorth, base, 0)) +
        repRow("Δ Patrimoine net", fmtMoney(r.deltas.netWorth, base, 0), r.deltas.netWorth >= 0 ? "success" : "danger") +
        repRow("Δ Revenus", fmtMoney(r.deltas.income, base, 0)) +
        repRow("Δ Dépenses", fmtMoney(r.deltas.expenses, base, 0)) +
        "</div></div>" +
        '<div class="card"><div class="card-h"><h3>Revenus et dépenses du mois</h3></div><div class="card-b">' +
        repRow("Revenus encaissés", fmtMoney(f.income, base, 0), "success") +
        repRow("Dont revenus passifs", fmtMoney(f.passive, base, 0)) +
        repRow("Revenus attendus (non encaissés)", fmtMoney(f.expected, base, 0)) +
        f.byCatIn.map(function(c){ return repRow("— " + catLabel("INCOME", c[0]), fmtMoney(c[1], base, 0)); }).join("") +
        repRow("Dépenses de consommation", fmtMoney(f.expense, base, 0), "danger") +
        f.byCatOut.map(function(c){ return repRow("— " + catLabel("EXPENSE", c[0]), fmtMoney(c[1], base, 0)); }).join("") +
        repRow("Charges financières (intérêts + frais)", fmtMoney(f.charges, base, 0)) +
        repRow("Capital remboursé (réduit la dette)", fmtMoney(f.capitalRepaid, base, 0)) +
        repRow("Décaissements totaux", fmtMoney(f.cashOut, base, 0)) +
        repRow("Cash-flow net", fmtMoney(f.net, base, 0), f.net >= 0 ? "success" : "danger") +
        repRow("Taux d'épargne", fmtPct(safeDiv(f.net, f.income) == null ? null : roundMoney(safeDiv(f.net, f.income) * 100, 1))) +
        "</div></div></div>" +
        (r.bilan.warnings.length ? '<div class="alert a-warn"><b>Données à compléter :</b><ul>' + r.bilan.warnings.slice(0, 6).map(function(w){ return "<li>" + esc(w) + "</li>"; }).join("") + "</ul></div>" : "");
    } else {
      var growth = roundMoney(r.end.netWorth - r.start.netWorth, 2);
      area.innerHTML = '<div class="grid2">' +
        '<div class="card"><div class="card-h"><h3>Patrimoine — année ' + r.year + "</h3></div><div class=\"card-b\">" +
        repRow("Patrimoine net au début de l'année", fmtMoney(r.start.netWorth, base, 0)) +
        repRow("Patrimoine net à la fin de l'année", fmtMoney(r.end.netWorth, base, 0), "accent") +
        repRow("Croissance du patrimoine", fmtMoney(growth, base, 0), growth >= 0 ? "success" : "danger") +
        repRow("Total actifs (fin)", fmtMoney(r.end.totalAssets, base, 0)) +
        repRow("Total passifs (fin)", fmtMoney(r.end.totalLiabilities, base, 0)) +
        repRow("Capital remboursé sur l'année", fmtMoney(r.repaid, base, 0), "success") +
        repRow("Intérêts + frais payés", fmtMoney(r.interestPaid, base, 0), "warning") +
        "</div></div>" +
        '<div class="card"><div class="card-h"><h3>Revenus, dépenses et épargne</h3></div><div class="card-b">' +
        repRow("Revenus encaissés", fmtMoney(r.flows.income, base, 0), "success") +
        repRow("Dont revenus passifs", fmtMoney(r.flows.passive, base, 0)) +
        repRow("Dépenses de consommation", fmtMoney(r.flows.expense, base, 0), "danger") +
        repRow("Charges financières", fmtMoney(r.flows.charges, base, 0)) +
        repRow("Cash-flow net", fmtMoney(r.flows.net, base, 0), r.flows.net >= 0 ? "success" : "danger") +
        repRow("Taux d'épargne", fmtPct(safeDiv(r.flows.net, r.flows.income) == null ? null : roundMoney(safeDiv(r.flows.net, r.flows.income) * 100, 1))) +
        "</div></div></div>" +
        '<div class="card"><div class="card-h"><h3>Évolution mensuelle</h3></div><div class="card-b">' +
        chartLine(r.series.labels.map(function(label, i){ return { label: label, netWorth: r.series.netWorth[i] }; }), [{ key: "netWorth", name: "Patrimoine net", color: "#4f46e5" }], { area: true }) +
        "</div></div>";
    }
  }
};

RENDER.settings = function(){

    ghRestore().then(function(r){ if (r === "restaurée") toast("Sauvegarde GitHub restaurée ✓", "ok"); })
      .catch(function(e){ toast(String(e.message || e), "err"); });
  };
  var ghAuto = document.getElementById("f_ghAuto");
  ghAuto.checked = !!ghCfg.auto;
  ghAuto.onchange = function(){ ghCfg.auto = ghAuto.checked; saveGhCfg(); toast(ghAuto.checked ? "Sauvegarde GitHub automatique activée." : "Sauvegarde GitHub automatique désactivée."); };

    if (pushSnapshot()){ toast("Instantané local créé."); RENDER.settings(); }

  };

    b.onclick = function(){ restoreSnapshot(+b.dataset.hist); };
  });
  updateGhStatus();
};

function openRateModal(){
  var base = DB.settings.baseCurrency;
  var others = DB.currencies.filter(function(c){ return c.code !== base; });
  if (!others.length){ toast("Ajoutez d'abord une autre devise.", "err"); return; }
  var body = '<p class="note" style="margin-top:0">1 unité de la devise choisie = X ' + esc(base) + ". L'ancien taux reste dans l'historique pour les calculs rétroactifs.</p>" +
    '<div class="frow">' +
    fSelect("currency", "Devise", others.map(function(c){ return { v: c.code, l: c.code + " — " + c.name }; }), others[0].code, { required: true }) +
    fInput("rate", "Taux (en " + esc(base) + " par 1 unité)", "number", "", { step: "any", required: true, placeholder: "Ex. 605" }) +
    fInput("date", "Date d'application", "date", todayISO(), { required: true }) +
    "</div>";
  openModal("Nouveau taux de change", body);
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: "Enregistrer", onClick: function(){
      var currency = gv("currency"), rate = gn("rate");
      if (!currency){ toast("Choisissez une devise.", "err"); return; }
      if (!(rate > 0)){ toast("Taux invalide.", "err"); return; }
      DB.rates.push({ id: uid(), currency: currency, rate: rate, date: gv("date") || todayISO() });
      saveDB(); closeModal(); rerender();
      toast("Taux " + currency + " enregistré (historique conservé).");
    }}
  ]);
}

function openCurrencyModal(){
  var body = '<div class="frow">' +
    fInput("code", "Code ISO", "text", "", { required: true, placeholder: "Ex. NGN" }) +
    fInput("name", "Nom", "text", "", { required: true, placeholder: "Ex. Naira nigérian" }) +
    fInput("symbol", "Symbole", "text", "", { placeholder: "Ex. ₦" }) +
    fInput("decimals", "Décimales", "number", "2", { min: "0" }) +
    "</div>";
  openModal("Ajouter une devise", body);
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: "Ajouter", onClick: function(){
      var code = gv("code").toUpperCase();
      if (!code || !gv("name")){ toast("Code et nom requis.", "err"); return; }
      if (DB.currencies.some(function(c){ return c.code === code; })){ toast("Cette devise existe déjà.", "err"); return; }
      DB.currencies.push({ code: code, name: gv("name"), symbol: gv("symbol") || code, decimals: Math.max(0, Math.min(4, gn("decimals") || 2)) });
      saveDB(); closeModal(); rerender();
      toast("Devise " + code + " ajoutée.");
    }}
  ]);
}

// ---------- Sauvegarde / restauration / démo / remise à zéro ----------
function exportBackup(){
  var payload = { app: "Personal Wealth Manager (web)", version: 1, exportedAt: new Date().toISOString(), data: DB };
  download("pwm-sauvegarde-" + todayISO() + ".json", JSON.stringify(payload, null, 2), "application/json");
  toast("Sauvegarde téléchargée — conservez-la hors de ce navigateur.");
}
function restoreBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try { parsed = JSON.parse(String(reader.result)); } catch (e){ toast("Fichier JSON invalide.", "err"); return; }
    var d = parsed && parsed.data ? parsed.data : parsed;
    if (!d || !d.settings || !Array.isArray(d.accounts)){ toast("Ce fichier n'est pas une sauvegarde PWM valide.", "err"); return; }
    if (!confirm("Restaurer cette sauvegarde (" + d.accounts.length + " comptes, " + (d.transactions || []).length + " opérations) ?\n\nLes données actuelles de ce navigateur seront REMPLACÉES.")) return;
    pushSnapshot();
    DB = normalizeDB(d);
    saveDB(); closeModal(); showPage("dashboard");
    toast("Sauvegarde restaurée intégralement.");
  };
  reader.readAsText(file);
}
function loadDemo(){
  if (!confirm("Charger les données de démonstration ?\n\nElles REMPLACENT les données actuelles. Téléchargez d'abord une sauvegarde si nécessaire.")) return;
  pushSnapshot();
  DB = makeDemoDB();
  saveDB(); closeModal();
  showPage("dashboard");
  toast("Données de démonstration chargées (marquées [Démo]).");
}
function resetAll(){
  if (!confirm("Effacer TOUTES les données de ce navigateur ?")) return;
  if (!confirm("Confirmer une seconde fois : cette action est irréversible.")) return;
  pushSnapshot();
  DB = blankDB();
  saveDB();
  showPage("dashboard");
  toast("Toutes les données ont été effacées.");
}

// ============================================================
// DÉMARRAGE
// ============================================================
document.querySelectorAll("nav button").forEach(function(b){
  b.onclick = function(){ showPage(b.dataset.page); };
});
DB = loadDB();
if (!DB){ DB = blankDB(); saveDB(); }
updateSaveInd(true);
showPage("dashboard");
</script>
