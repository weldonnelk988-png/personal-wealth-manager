<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Wealth Manager — Site web</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --border:#e5e8ee; --text:#1a2233; --muted:#64708a;
  --accent:#4f46e5; --accent-soft:#eef2ff; --success:#059669; --danger:#dc2626; --warning:#d97706;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:clamp(13px,2.4vw,14px);line-height:1.45}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd2de;border-radius:8px}

/* ---------- En-tête ---------- */
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border)}
.header-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(10px,3vw,20px)}
.brand{font-weight:800;color:var(--accent);font-size:clamp(1rem,3.4vw,1.2rem);letter-spacing:-.01em;white-space:nowrap;min-width:0;flex-shrink:1;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.save-ind{font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap;min-width:0;flex-shrink:1;overflow:hidden;text-overflow:ellipsis}
.save-ind b{color:var(--success)}

/* ---------- Navigation ---------- */
nav{position:sticky;top:49px;z-index:25;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-in{max-width:1200px;margin:0 auto;display:flex;gap:2px;padding:4px clamp(6px,2vw,14px);min-width:max-content}
nav button{appearance:none;border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.active{background:var(--accent-soft);color:var(--accent)}
nav button:hover{background:#f1f3f8}
nav button.active:hover{background:#e3e8ff}

main{max-width:1200px;margin:0 auto;padding:clamp(12px,3vw,22px)}

/* ---------- Cartes / KPI ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.05);margin-bottom:14px;break-inside:avoid}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{margin:0;font-size:.92rem}
.card-h .sub{font-size:.72rem;color:var(--muted);margin-top:2px}
.card-b{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.kpi .l{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .v{margin-top:4px;font-size:clamp(1.05rem,3vw,1.3rem);font-weight:800;font-variant-numeric:tabular-nums}
.kpi .s{margin-top:3px;font-size:.7rem;color:var(--muted)}
.pos{color:var(--success)} .neg{color:var(--danger)} .warn{color:var(--warning)} .acc{color:var(--accent)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}

/* ---------- Tableaux ---------- */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.05)}
table{width:100%;min-width:640px;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:.82rem;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfe}
.r{text-align:right}
.nowrap{white-space:nowrap}

/* ---------- Boutons / badges / champs ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid transparent;
  padding:7px 13px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-p{background:var(--accent);color:#fff} .btn-p:hover{background:#4338ca}
.btn-s{background:#fff;border-color:var(--border);color:var(--text)} .btn-s:hover{background:#f1f3f8}
.btn-d{background:var(--danger);color:#fff} .btn-d:hover{background:#b91c1c}
.btn-x{padding:4px 9px;font-size:.72rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.78rem;cursor:pointer;text-decoration:underline}
.link.d{color:var(--danger)}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:.68rem;font-weight:600}
.b-blue{background:#e0f2fe;color:#0369a1} .b-violet{background:#ede9fe;color:#6d28d9}
.b-green{background:#d1fae5;color:#047857} .b-red{background:#fee2e2;color:#b91c1c}
.b-amber{background:#fef3c7;color:#b45309} .b-gray{background:#e2e8f0;color:#475569}

label{display:block;margin-bottom:10px}
label .lab{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:4px}
label .hint{display:block;font-size:.68rem;color:var(--muted);margin-top:3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.85rem;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
input:disabled{background:#f1f3f8;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}

/* ---------- Alertes ---------- */
.alert{border-radius:10px;padding:9px 13px;font-size:.78rem;margin-bottom:12px;border:1px solid}
.a-err{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.a-ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.a-warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.a-warn ul{margin:4px 0 0;padding-left:18px}
.empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:.85rem}
.empty .btn{margin-top:10px}

/* ---------- Modale ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin:auto}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:.95rem}
.modal-x{background:none;border:0;font-size:1rem;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px}
.modal-x:hover{background:#f1f3f8}
.modal-b{padding:14px 16px;max-height:72vh;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}

/* ---------- Graphiques ---------- */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.72rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.pbar{height:8px;border-radius:99px;background:#e8ebf2;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.pbar i.done{background:var(--success)}

/* ---------- Divers ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:#f8fafc;border-radius:9px;padding:6px 10px;font-size:.78rem}
.chip b{margin-right:4px}
.tabs{display:flex;gap:2px;background:#eef0f5;border-radius:10px;padding:3px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{appearance:none;border:0;background:none;padding:6px 13px;border-radius:8px;font:inherit;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.active{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.note{font-size:.72rem;color:var(--muted);margin-top:8px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.section-title{margin:18px 0 8px;font-size:.85rem;font-weight:800;color:var(--text)}
.onboard{text-align:center;padding:40px 16px}
.onboard h2{font-size:clamp(1.2rem,4vw,1.5rem);margin:0 0 8px}
.onboard p{color:var(--muted);max-width:520px;margin:0 auto 18px}
.onboard .row-actions{justify-content:center}

@media (max-width:640px){
  .kpi{padding:10px 12px}
  .card-h{padding:9px 12px}
  .card-b{padding:10px 12px}
  .save-ind{max-width:46vw}
  .header-in{padding:8px 10px}
}
@media print{
  header,nav,.no-print{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
  main{max-width:none;padding:0}
}
</style>
</head>
<body>
<header>
  <div class="header-in">
    <div class="brand">Personal Wealth Manager<small>Pilotage patrimonial — site web autonome</small></div>
    <div class="save-ind" id="saveInd">Données locales</div>
  </div>
</header>

<nav><div class="nav-in" id="nav">
  <button data-page="dashboard" class="active">Tableau de bord</button>
  <button data-page="accounts">Comptes</button>
  <button data-page="transactions">Transactions</button>
  <button data-page="assets">Actifs</button>
  <button data-page="liabilities">Passifs &amp; dettes</button>
  <button data-page="trading">Trading</button>
  <button data-page="objectives">Objectifs</button>
  <button data-page="reports">Rapports</button>
  <button data-page="settings">Paramètres</button>
</div></nav>

<main>
  <section id="page-dashboard"></section>
  <section id="page-accounts" class="hidden" style="display:none"></section>
  <section id="page-transactions" class="hidden" style="display:none"></section>
  <section id="page-assets" class="hidden" style="display:none"></section>
  <section id="page-liabilities" class="hidden" style="display:none"></section>
  <section id="page-trading" class="hidden" style="display:none"></section>
  <section id="page-objectives" class="hidden" style="display:none"></section>
  <section id="page-reports" class="hidden" style="display:none"></section>
  <section id="page-settings" class="hidden" style="display:none"></section>
</main>

<div id="modalRoot"></div>
<div id="toastRoot" style="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:70;max-width:92vw"></div>

<script>
"use strict";
/* ============================================================
   PERSONAL WEALTH MANAGER — ÉDITION SITE WEB AUTONOME
   Moteur financier centralisé : fonctions pures, aucune dépendance.
   Règles : transferts neutres, capital ≠ dépense, dépôts ≠ gains,
   valorisations historisées, taux de change jamais inventés.
   ============================================================ */
/*ENGINE-START*/
let DB = null;

// ---------- Référentiels ----------
var DEFAULT_CURRENCIES = [
  { code: "XAF", name: "Franc CFA (BEAC)", symbol: "FCFA", decimals: 0 },
  { code: "USD", name: "Dollar américain", symbol: "$", decimals: 2 },
  { code: "EUR", name: "Euro", symbol: "€", decimals: 2 },
  { code: "GBP", name: "Livre sterling", symbol: "£", decimals: 2 },
  { code: "JPY", name: "Yen japonais", symbol: "¥", decimals: 0 },
  { code: "CHF", name: "Franc suisse", symbol: "CHF", decimals: 2 },
  { code: "CAD", name: "Dollar canadien", symbol: "C$", decimals: 2 },
  { code: "AUD", name: "Dollar australien", symbol: "A$", decimals: 2 },
  { code: "NZD", name: "Dollar néo-zélandais", symbol: "NZ$", decimals: 2 }
];
var ACCOUNT_TYPES = [
  ["BANK","Banque"],["MOBILE_MONEY","Mobile Money"],["CASH","Espèces"],["SAVINGS","Épargne"],
  ["BROKERAGE","Compte de courtage"],["TRADING","Compte de trading"],["INVESTMENT","Portefeuille d'investissement"],["OTHER","Autres réserves"]
];
var INCOME_CATEGORIES = [
  ["SALARY","Salaires",false],["FREELANCE","Prestations",false],["BUSINESS","Revenus commerciaux",false],
  ["RENT","Loyers",true],["DIVIDENDS","Dividendes",true],["INTEREST","Intérêts",true],
  ["INVESTMENT_INCOME","Revenus d'investissement",true],["TRADING_REALIZED","Gains de trading réalisés",false],
  ["EXCEPTIONAL","Revenus exceptionnels",false],["PASSIVE_OTHER","Autres revenus passifs",true]
];
var EXPENSE_CATEGORIES = [
  ["HOUSING","Logement"],["FOOD","Alimentation"],["TRANSPORT","Transport"],["HEALTH","Santé"],
  ["LEISURE","Loisirs"],["EDUCATION","Éducation"],["SUBSCRIPTIONS","Abonnements"],["OTHER_PERSONAL","Autres (personnel)"],
  ["MAINTENANCE","Entretien"],["INSURANCE","Assurance"],["REPAIR","Réparation"],["TAXES","Taxes"],
  ["MANAGEMENT_FEES","Frais de gestion"],["BANK_FEES","Frais bancaires"],["COMMISSIONS","Commissions"],
  ["INVESTMENT_FEES","Frais d'investissement"],["TRADING_LOSS","Pertes de trading réalisées"]
];
var ASSET_CATEGORIES = [
  ["REAL_ESTATE","Immobilier"],["LAND","Terrains"],["VEHICLE","Véhicules"],["STOCKS","Actions"],["BONDS","Obligations"],
  ["ETF","ETF"],["GOLD","Or et métaux précieux"],["BUSINESS","Entreprises et participations"],["EQUIPMENT","Équipements"],["OTHER","Autres biens"]
];
var LIABILITY_CATEGORIES = [
  ["MORTGAGE","Crédit immobilier"],["AUTO","Crédit automobile"],["PERSONAL","Emprunt personnel"],
  ["BUSINESS","Dettes professionnelles"],["OTHER","Dettes diverses"],["COMMITMENT","Engagement financier"]
];
var OBJECTIVE_TYPES = [
  ["NET_WORTH","Patrimoine net cible"],["PASSIVE_INCOME","Revenu passif mensuel cible"],
  ["EMERGENCY_FUND","Réserve de sécurité"],["DEBT_REDUCTION","Réduction de l'endettement"],["INVESTMENT_CAPITAL","Capital investi productif"]
];
var LIQUIDITY_LEVELS = [["LIQUID","Liquide"],["SEMI_LIQUIDE","Semi-liquide"],["SEMI_LIQUID","Semi-liquide"],["ILLIQUID","Illiquide"]];
var PASSIVE_CATEGORIES = {};
INCOME_CATEGORIES.forEach(function(c){ if (c[2]) PASSIVE_CATEGORIES[c[0]] = true; });
var FEE_CATEGORIES = { COMMISSIONS:1, INVESTMENT_FEES:1, BANK_FEES:1, MANAGEMENT_FEES:1 };

function labelOf(list, value){
  if (!value) return "—";
  for (var i = 0; i < list.length; i++){ if (list[i][0] === value) return list[i][1]; }
  return value;
}
function catLabel(type, value){
  if (!value) return "—";
  var list = type === "INCOME" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  return labelOf(list, value);
}

// ---------- Utilitaires monétaires ----------
function roundMoney(x, d){ d = d == null ? 2 : d; var f = Math.pow(10, d); return Math.round((x + Number.EPSILON) * f) / f; }
function safeDiv(a, b){ return (isFinite(a) && isFinite(b) && b !== 0) ? a / b : null; }
function sumArr(a){ var s = 0; for (var i = 0; i < a.length; i++){ if (isFinite(a[i])) s += a[i]; } return s; }
function toBase(amount, rate){ return (isFinite(amount) && isFinite(rate) && rate > 0) ? roundMoney(amount * rate, 2) : 0; }
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function isNeutral(type){ return type === "TRANSFER" || type === "ADJUSTMENT"; }

// ---------- Taux de change ----------
// rate = nombre d'unités de la devise de base pour 1 unité de la devise.
// findRate : dernier taux connu ≤ date ; repli sur le premier taux connu si demandé (signalé) ; sinon null (jamais inventé).
function rateFor(currency, atTs, fallback){
  if (!DB) return null;
  if (currency === DB.settings.baseCurrency) return 1;
  var best = null, earliest = null;
  for (var i = 0; i < DB.rates.length; i++){
    var r = DB.rates[i];
    if (r.currency !== currency) continue;
    var ts = Date.parse(r.date);
    if (earliest === null || ts < Date.parse(earliest.date)) earliest = r;
    if (ts <= atTs && (best === null || ts > Date.parse(best.date))) best = r;
  }
  if (best) return best.rate;
  if (fallback && earliest) return earliest.rate;
  return null;
}
function latestRateOf(currency){
  if (currency === DB.settings.baseCurrency) return 1;
  var best = null;
  for (var i = 0; i < DB.rates.length; i++){
    var r = DB.rates[i];
    if (r.currency !== currency) continue;
    if (best === null || r.date > best.date) best = r;
  }
  return best ? best.rate : null;
}

// ---------- Comptes de trading (par type de compte ; plus aucun système d'espaces) ----------
function isTradingAccount(a){ return !!a && (a.type === "TRADING" || a.type === "BROKERAGE" || a.type === "INVESTMENT"); }

// ---------- Moteur de soldes ----------
// INCOME +, EXPENSE −, TRANSFER − au départ / + à l'arrivée, ADJUSTMENT ± (documenté),
// paiements de passif − (capital + intérêts + frais). Seules les opérations CONFIRMED affectent le solde.
function balanceOf(accountId, atTs){
  var acc = DB.accounts.find(function(a){ return a.id === accountId; });
  if (!acc) return 0;
  var bal = acc.initialBalance || 0;
  for (var i = 0; i < DB.transactions.length; i++){
    var t = DB.transactions[i];
    if (t.status !== "CONFIRMED") continue;
    if (Date.parse(t.date) > atTs) continue;
    if (t.type === "TRANSFER"){
      if (t.accountId === accountId) bal -= t.amount;
      if (t.toAccountId === accountId) bal += (t.toAmount != null ? t.toAmount : t.amount);
    } else if (t.accountId === accountId){
      if (t.type === "INCOME") bal += t.amount;
      else if (t.type === "EXPENSE") bal -= t.amount;
      else if (t.type === "ADJUSTMENT") bal += t.amount;
    }
  }
  for (var j = 0; j < DB.payments.length; j++){
    var p = DB.payments[j];
    if (p.accountId !== accountId) continue;
    if (Date.parse(p.date) > atTs) continue;
    bal -= (p.capital + p.interest + p.fees);
  }
  return roundMoney(bal, 2);
}

function liabilityRemaining(liabilityId, atTs){
  var l = DB.liabilities.find(function(x){ return x.id === liabilityId; });
  if (!l) return 0;
  var paid = 0;
  for (var i = 0; i < DB.payments.length; i++){
    var p = DB.payments[i];
    if (p.liabilityId === liabilityId && Date.parse(p.date) <= atTs) paid += p.capital;
  }
  return roundMoney(Math.max(0, l.initialAmount - paid), 2);
}

// ---------- Valorisation d'actifs (historique, jamais écrasé) ----------
function assetValueAt(assetId, atTs){
  var best = null;
  for (var i = 0; i < DB.valuations.length; i++){
    var v = DB.valuations[i];
    if (v.assetId !== assetId) continue;
    var ts = Date.parse(v.date);
    if (ts <= atTs && (best === null || ts > Date.parse(best.date))) best = v;
  }
  return best;
}
function assetCost(a){ return roundMoney((a.purchasePrice || 0) + (a.fees || 0), 2); }

function excludedAssetIds(){
  var out = {};
  for (var i = 0; i < DB.accounts.length; i++){
    var a = DB.accounts[i];
    if (!isTradingAccount(a) || a.equity == null) continue;
    for (var j = 0; j < DB.assets.length; j++){
      var as = DB.assets[j];
      if (as.accountId === a.id && as.status === "ACTIVE") out[as.id] = true;
    }
  }
  return out;
}

// ---------- Statistiques patrimoniales ----------
// Les comptes de trading comptent UNE seule fois, via leur equity (ou solde si non saisie).
function statsAt(atTs){
  var base = DB.settings.baseCurrency;
  var warnings = [];
  var cashPersonal = 0, cashAll = 0, tradingValue = 0, assetsValue = 0, liabilities = 0;
  var missingVal = [];
  var excluded = excludedAssetIds();
  var warnedExcluded = {};

  for (var i = 0; i < DB.accounts.length; i++){
    var a = DB.accounts[i];
    if (a.status !== "ACTIVE") continue;
    var b = balanceOf(a.id, atTs);
    var rate = rateFor(a.currency, atTs, true);
    if (rate == null){ warnings.push("Aucun taux connu pour " + a.currency + " : compte « " + a.name + " » exclu des totaux en " + base + "."); continue; }
    var inBase = toBase(b, rate);
    cashAll += inBase;
    if (!isTradingAccount(a)) cashPersonal += inBase;
  }
  for (var i2 = 0; i2 < DB.accounts.length; i2++){
    var a2 = DB.accounts[i2];
    if (a2.status !== "ACTIVE" || !isTradingAccount(a2)) continue;
    var eq = (a2.equity != null) ? a2.equity : balanceOf(a2.id, atTs);
    var r2 = rateFor(a2.currency, atTs, true);
    if (r2 == null){ warnings.push("Taux " + a2.currency + " manquant : compte trading « " + a2.name + " » exclu."); continue; }
    tradingValue += toBase(eq, r2);
  }
  for (var i3 = 0; i3 < DB.assets.length; i3++){
    var as = DB.assets[i3];
    if (as.status !== "ACTIVE") continue;
    if (excluded[as.id]){
      if (!warnedExcluded[as.id]){
        warnedExcluded[as.id] = true;
        var accLink = DB.accounts.find(function(x){ return x.id === as.accountId; });
        warnings.push("Actif « " + as.name + " » non additionné : sa valeur est déjà incluse dans l'equity saisie du compte" + (accLink ? " « " + accLink.name + " »" : "") + ".");
      }
      continue;
    }
    var v = assetValueAt(as.id, atTs);
    var amount, cur, dateISO, missing = false;
    if (v){ amount = v.value; cur = v.currency || as.currency; dateISO = v.date; }
    else { amount = assetCost(as); cur = as.currency; dateISO = as.acquisitionDate || as.createdAt || "2000-01-01"; missing = true; }
    var r3 = rateFor(cur, Date.parse(dateISO), true);
    if (r3 == null){ warnings.push("Taux " + cur + " manquant : actif « " + as.name + " » exclu des totaux."); continue; }
    if (missing) missingVal.push(as.name);
    assetsValue += toBase(amount, r3);
  }
  if (missingVal.length) warnings.push("Actifs sans valorisation, comptés au coût d'acquisition : " + missingVal.join(", ") + ".");
  for (var i4 = 0; i4 < DB.liabilities.length; i4++){
    var l = DB.liabilities[i4];
    if (l.status !== "ACTIVE") continue;
    var rem = liabilityRemaining(l.id, atTs);
    var r4 = rateFor(l.currency, Date.parse(l.startDate || "2000-01-01"), true);
    if (r4 == null){ warnings.push("Taux " + l.currency + " manquant : dette « " + l.name + " » exclue."); continue; }
    liabilities += toBase(rem, r4);
  }
  var totalAssets = roundMoney(cashPersonal + assetsValue + tradingValue, 2);
  var totalLiab = roundMoney(liabilities, 2);
  return {
    cashPersonal: roundMoney(cashPersonal, 2),
    cashAll: roundMoney(cashAll, 2),
    assetsValue: roundMoney(assetsValue, 2),
    tradingValue: roundMoney(tradingValue, 2),
    totalAssets: totalAssets,
    totalLiabilities: totalLiab,
    netWorth: roundMoney(totalAssets - totalLiab, 2),
    warnings: warnings
  };
}
/*ENGINE-MID*/

// ---------- Flux de période (revenus / dépenses / cash-flow) ----------
function flowsBetween(fromTs, toTs){
  var base = DB.settings.baseCurrency;
  var warnings = [];
  var income = 0, expense = 0, passive = 0, expected = 0;
  var byCatIn = {}, byCatOut = {};
  for (var i = 0; i < DB.transactions.length; i++){
    var t = DB.transactions[i];
    var ts = Date.parse(t.date);
    if (ts < fromTs || ts > toTs) continue;
    if (t.status !== "CONFIRMED"){
      if (t.status === "EXPECTED" && t.type === "INCOME"){
        var rr = rateFor(t.currency, ts, true);
        if (rr != null) expected += toBase(t.amount, rr);
      }
      continue;
    }
    if (t.type === "TRANSFER" || t.type === "ADJUSTMENT") continue; // jamais revenu/dépense
    var r = rateFor(t.currency, ts, true);
    if (r == null){ warnings.push("Taux " + t.currency + " manquant pour « " + t.label + " » : exclu des totaux."); continue; }
    var b = toBase(t.amount, r);
    if (t.type === "INCOME"){
      income += b;
      var kIn = t.category || "OTHER";
      byCatIn[kIn] = (byCatIn[kIn] || 0) + b;
      if (PASSIVE_CATEGORIES[t.category]) passive += b;
    } else {
      expense += b;
      var kOut = t.category || "OTHER_PERSONAL";
      byCatOut[kOut] = (byCatOut[kOut] || 0) + b;
    }
  }
  var charges = 0, capitalRepaid = 0;
  for (var j = 0; j < DB.payments.length; j++){
    var p = DB.payments[j];
    var pts = Date.parse(p.date);
    if (pts < fromTs || pts > toTs) continue;
    var l = DB.liabilities.find(function(x){ return x.id === p.liabilityId; });
    if (!l) continue;
    var total = p.capital + p.interest + p.fees;
    if (total <= 0) continue;
    var rp = rateFor(p.currency || l.currency, pts, true);
    if (rp == null) continue;
    var pb = toBase(total, rp);
    var chargePart = pb * ((p.interest + p.fees) / total);
    charges += chargePart;
    capitalRepaid += pb - chargePart;
  }
  expense = roundMoney(expense, 2);
  charges = roundMoney(charges, 2);
  capitalRepaid = roundMoney(capitalRepaid, 2);
  var catsIn = Object.keys(byCatIn).map(function(k){ return [k, roundMoney(byCatIn[k], 2)]; }).sort(function(a,b){ return b[1]-a[1]; });
  var catsOut = Object.keys(byCatOut).map(function(k){ return [k, roundMoney(byCatOut[k], 2)]; }).sort(function(a,b){ return b[1]-a[1]; });
  return {
    income: roundMoney(income, 2), expense: expense,
    passive: roundMoney(passive, 2), expected: roundMoney(expected, 2),
    charges: charges, capitalRepaid: capitalRepaid,
    cashOut: roundMoney(expense + charges + capitalRepaid, 2),
    net: roundMoney(income - expense - charges - capitalRepaid, 2),
    byCatIn: catsIn, byCatOut: catsOut, warnings: warnings
  };
}

// ---------- Agrégations temporelles ----------
function monthKeyOf(ts){ var d = new Date(ts); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0"); }
function monthLabelFr(key){ var p = key.split("-"); return new Date(Date.UTC(+p[0], +p[1]-1, 1)).toLocaleDateString("fr-FR", { month: "short", year: "2-digit" }); }
function monthBuckets(fromTs, toTs){
  var out = [];
  var d0 = new Date(fromTs);
  var d = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1));
  while (d.getTime() <= toTs){ out.push(d.getTime()); d.setUTCMonth(d.getUTCMonth() + 1); }
  return out;
}
function monthStartTs(bucketTs){ var d = new Date(bucketTs); return Date.parse(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1))); }
function monthEndTs(bucketTs){ var d = new Date(bucketTs); return Date.parse(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0, 23, 59, 59))); }
function toMonthly(amount, freq){
  if (!isFinite(amount)) return 0;
  if (freq === "WEEKLY") return roundMoney(amount * 52 / 12, 2);
  if (freq === "QUARTERLY") return roundMoney(amount / 3, 2);
  if (freq === "ANNUAL") return roundMoney(amount / 12, 2);
  if (freq === "MONTHLY") return roundMoney(amount, 2);
  return 0;
}

// ---------- Séries mensuelles ----------
function monthlySeries(fromTs, toTs){
  var buckets = monthBuckets(fromTs, toTs);
  var labels = [], netWorth = [], liquidity = [], investments = [], income = [], expenses = [];
  var base = DB.settings.baseCurrency;
  for (var i = 0; i < buckets.length; i++){
    var endTs = monthEndTs(buckets[i]);
    var st = statsAt(endTs);
    labels.push(monthKeyOf(buckets[i]));
    netWorth.push(st.netWorth);
    var cash = 0;
    for (var j = 0; j < DB.accounts.length; j++){
      var a = DB.accounts[j];
      if (a.status !== "ACTIVE") continue;
      var r = rateFor(a.currency, endTs, true);
      if (r == null) continue;
      cash += toBase(balanceOf(a.id, endTs), r);
    }
    liquidity.push(roundMoney(cash, 2));
    var inv = 0;
    var excluded = excludedAssetIds();
    for (var k = 0; k < DB.accounts.length; k++){
      var ta = DB.accounts[k];
      if (ta.status !== "ACTIVE" || !isTradingAccount(ta)) continue;
      var rt = rateFor(ta.currency, endTs, true);
      if (rt == null) continue;
      inv += toBase(ta.equity != null ? ta.equity : balanceOf(ta.id, endTs), rt);
    }
    for (var m = 0; m < DB.assets.length; m++){
      var as = DB.assets[m];
      if (as.status !== "ACTIVE" || as.role !== "INVESTMENT" || excluded[as.id]) continue;
      var v = assetValueAt(as.id, endTs);
      if (!v) continue;
      var rv = rateFor(v.currency || as.currency, Date.parse(v.date), true);
      if (rv == null) continue;
      inv += toBase(v.value, rv);
    }
    investments.push(roundMoney(inv, 2));
    var f = flowsBetween(monthStartTs(buckets[i]), endTs);
    income.push(f.income);
    expenses.push(roundMoney(f.expense + f.charges, 2));
  }
  return { labels: labels, netWorth: netWorth, liquidity: liquidity, investments: investments, income: income, expenses: expenses };
}

// ---------- Performance : XIRR et TWR ----------
function xirr(flows){
  if (!flows || flows.length < 2) return null;
  var fs = flows.slice().sort(function(a,b){ return Date.parse(a.date) - Date.parse(b.date); });
  var t0 = Date.parse(fs[0].date);
  var hasPos = false, hasNeg = false;
  for (var i = 0; i < fs.length; i++){ if (fs[i].amount > 0) hasPos = true; if (fs[i].amount < 0) hasNeg = true; }
  if (!hasPos || !hasNeg) return null;
  function yr(ts){ return (ts - t0) / (365.25 * 86400000); }
  function npv(r){ var s = 0; for (var i = 0; i < fs.length; i++){ s += fs[i].amount / Math.pow(1 + r, yr(Date.parse(fs[i].date))); } return s; }
  function dnpv(r){ var s = 0; for (var i = 0; i < fs.length; i++){ var t = yr(Date.parse(fs[i].date)); s -= fs[i].amount * t / Math.pow(1 + r, t + 1); } return s; }
  var r = 0.1;
  for (var n = 0; n < 100; n++){
    var v = npv(r);
    if (Math.abs(v) < 1e-7) return r;
    var d = dnpv(r);
    if (!isFinite(d) || d === 0) break;
    r = r - v / d;
    if (r <= -0.9999) r = -0.9999;
    if (!isFinite(r)) break;
  }
  if (isFinite(r) && Math.abs(npv(r)) < 1e-5) return r;
  var low = -0.9999, high = 10;
  var fL = npv(low), fH = npv(high);
  if (!isFinite(fL)) return null;
  var g = 0;
  while (fL * fH > 0 && g++ < 60){ high *= 10; fH = npv(high); if (!isFinite(fH)) return null; }
  if (fL * fH > 0) return null;
  for (var n2 = 0; n2 < 200; n2++){
    var mid = (low + high) / 2;
    var fm = npv(mid);
    if (Math.abs(fm) < 1e-7) return mid;
    if (fL * fm < 0){ high = mid; } else { low = mid; fL = fm; }
  }
  return (low + high) / 2;
}

function twr(points){
  if (!points || points.length < 2) return null;
  var ps = points.slice().sort(function(a,b){ return Date.parse(a.date) - Date.parse(b.date); });
  var product = 1, ok = false;
  for (var i = 1; i < ps.length; i++){
    var prev = ps[i-1], cur = ps[i];
    if (!(prev.value > 0)) continue;
    var r = (cur.value - cur.flow - prev.value) / prev.value;
    if (!isFinite(r)) continue;
    product *= (1 + r);
    ok = true;
  }
  return ok ? product - 1 : null;
}

// ---------- Performance des comptes de trading ----------
function tradingPerf(){
  var now = Date.now();
  return DB.accounts.filter(function(a){ return isTradingAccount(a) && a.status === "ACTIVE"; }).map(function(a){
    var deposits = 0, withdrawals = 0;
    var flowsArr = [];
    if (a.initialBalance > 0){
      deposits += a.initialBalance;
      flowsArr.push({ date: a.createdAt || "2000-01-01", amount: -a.initialBalance });
    }
    for (var i = 0; i < DB.transactions.length; i++){
      var t = DB.transactions[i];
      if (t.type !== "TRANSFER" || t.status !== "CONFIRMED" || Date.parse(t.date) > now) continue;
      if (t.toAccountId === a.id){ var amt = t.toAmount != null ? t.toAmount : t.amount; deposits += amt; flowsArr.push({ date: t.date, amount: -amt }); }
      if (t.accountId === a.id){ withdrawals += t.amount; flowsArr.push({ date: t.date, amount: t.amount }); }
    }
    var gains = 0, losses = 0, fees = 0;
    for (var j = 0; j < DB.transactions.length; j++){
      var tx = DB.transactions[j];
      if (tx.accountId !== a.id || tx.status !== "CONFIRMED") continue;
      if (tx.type === "INCOME") gains += tx.amount;
      else if (tx.type === "EXPENSE"){
        if (tx.category === "TRADING_LOSS") losses += tx.amount;
        if (FEE_CATEGORIES[tx.category]) fees += tx.amount;
      }
    }
    var balance = balanceOf(a.id, now);
    var equity = a.equity != null ? a.equity : balance;
    flowsArr.push({ date: new Date(now).toISOString().slice(0, 10), amount: equity });
    // TWR à partir de l'historique d'equity + flux externes entre instantanés
    var hist = (a.equityHistory || []).slice().sort(function(x,y){ return Date.parse(x.date) - Date.parse(y.date); });
    var points = [];
    for (var h = 0; h < hist.length; h++){
      var prev = h > 0 ? hist[h-1] : null;
      var flow = 0;
      for (var q = 0; q < DB.transactions.length; q++){
        var tt = DB.transactions[q];
        if (tt.type !== "TRANSFER" || tt.status !== "CONFIRMED") continue;
        var ts = Date.parse(tt.date);
        var from = prev ? Date.parse(prev.date) : -1;
        if (ts <= from || ts > Date.parse(hist[h].date)) continue;
        if (tt.toAccountId === a.id) flow += (tt.toAmount != null ? tt.toAmount : tt.amount);
        if (tt.accountId === a.id) flow -= tt.amount;
      }
      points.push({ date: hist[h].date, value: hist[h].equity, flow: flow });
    }
    if (a.equity != null && hist.length && Date.parse(hist[hist.length-1].date) < now - 86400000){
      var last = hist[hist.length-1];
      var flow2 = 0;
      for (var q2 = 0; q2 < DB.transactions.length; q2++){
        var t2 = DB.transactions[q2];
        if (t2.type !== "TRANSFER" || t2.status !== "CONFIRMED") continue;
        var ts2 = Date.parse(t2.date);
        if (ts2 <= Date.parse(last.date) || ts2 > now) continue;
        if (t2.toAccountId === a.id) flow2 += (t2.toAmount != null ? t2.toAmount : t2.amount);
        if (t2.accountId === a.id) flow2 -= t2.amount;
      }
      points.push({ date: new Date(now).toISOString().slice(0, 10), value: a.equity, flow: flow2 });
    }
    return {
      id: a.id, name: a.name, currency: a.currency, type: a.type,
      deposits: roundMoney(deposits, 2), withdrawals: roundMoney(withdrawals, 2),
      balance: balance, equity: equity, equityIsOverride: a.equity != null,
      unrealized: a.equity != null ? roundMoney(equity - balance, 2) : null,
      realized: roundMoney(gains - losses - fees, 2), fees: roundMoney(fees, 2),
      xirr: xirr(flowsArr), twr: twr(points), historyCount: hist.length
    };
  });
}

// ---------- Analyses des actifs ----------
function assetAnalytics(){
  var base = DB.settings.baseCurrency, now = Date.now();
  var st = statsAt(now);
  var excluded = excludedAssetIds();
  return DB.assets.map(function(a){
    var cost = assetCost(a);
    var v = assetValueAt(a.id, now);
    var value = v ? v.value : null, valueDate = v ? v.date : null;
    var valueBase = null;
    if (v){
      var r = rateFor(v.currency || a.currency, Date.parse(v.date), true);
      if (r != null) valueBase = toBase(v.value, r);
    }
    var gain = value != null ? roundMoney(value - cost, 2) : null;
    var gainPct = value != null ? safeDiv(gain, cost) : null;
    var cumIn = 0, cumOut = 0, yIn = 0, yOut = 0;
    var yearAgo = now - 365.25 * 86400000;
    for (var i = 0; i < DB.transactions.length; i++){
      var t = DB.transactions[i];
      if (t.assetId !== a.id || t.status !== "CONFIRMED") continue;
      if (t.type !== "INCOME" && t.type !== "EXPENSE") continue;
      var rr = rateFor(t.currency, Date.parse(t.date), true);
      if (rr == null) continue;
      var b = toBase(t.amount, rr);
      if (t.type === "INCOME"){ cumIn += b; if (Date.parse(t.date) >= yearAgo) yIn += b; }
      else { cumOut += b; if (Date.parse(t.date) >= yearAgo) yOut += b; }
    }
    cumIn = roundMoney(cumIn, 2); cumOut = roundMoney(cumOut, 2);
    yIn = roundMoney(yIn, 2); yOut = roundMoney(yOut, 2);
    var expectedMonthly = (a.expectedIncome && a.incomeFrequency) ? toMonthly(a.expectedIncome, a.incomeFrequency) : 0;
    var contribution = null;
    if (valueBase != null && st.netWorth !== 0) contribution = roundMoney(safeDiv(valueBase, st.netWorth) * 100, 1);
    return {
      id: a.id, name: a.name, category: a.category, currency: a.currency, status: a.status,
      cost: cost, value: value, valueDate: valueDate, valueBase: valueBase,
      gain: gain, gainPct: gainPct,
      cumIn: cumIn, cumOut: cumOut, net: roundMoney(cumIn - cumOut, 2),
      grossYield: safeDiv(yIn, cost) == null ? null : roundMoney(safeDiv(yIn, cost) * 100, 1),
      netYield: safeDiv(yIn - yOut, cost) == null ? null : roundMoney(safeDiv(yIn - yOut, cost) * 100, 1),
      holdingCost: roundMoney(cumOut - cumIn, 2),
      expectedMonthly: expectedMonthly,
      missing: !v,
      contribution: contribution
    };
  });
}

// ---------- Analyses des passifs ----------
function liabilityInfo(l){
  var capital = 0, interest = 0, fees = 0;
  for (var i = 0; i < DB.payments.length; i++){
    var p = DB.payments[i];
    if (p.liabilityId !== l.id) continue;
    capital += p.capital; interest += p.interest; fees += p.fees;
  }
  var remaining = liabilityRemaining(l.id, Date.now());
  return {
    id: l.id, capitalPaid: roundMoney(capital, 2), interestPaid: roundMoney(interest, 2), feesPaid: roundMoney(fees, 2),
    remaining: remaining, progress: safeDiv(capital, l.initialAmount) == null ? null : roundMoney(safeDiv(capital, l.initialAmount) * 100, 1)
  };
}

// ---------- Échéancier théorique ----------
function amortizationOf(l, maxPeriods){
  maxPeriods = maxPeriods || 600;
  if (!l.scheduledPayment || l.scheduledPayment <= 0) return { rows: [], note: "Aucune mensualité définie : échéancier indisponible." };
  var ppy = { WEEKLY: 52, MONTHLY: 12, QUARTERLY: 4, ANNUAL: 1 }[l.frequency] || 12;
  var rate = (l.interestRate || 0) / 100 / ppy;
  var rows = [], rem = l.initialAmount;
  function addPeriod(iso, n){
    var d = new Date(iso);
    if (l.frequency === "WEEKLY") d.setUTCDate(d.getUTCDate() + 7 * n);
    else if (l.frequency === "QUARTERLY") d.setUTCMonth(d.getUTCMonth() + 3 * n);
    else if (l.frequency === "ANNUAL") d.setUTCFullYear(d.getUTCFullYear() + n);
    else d.setUTCMonth(d.getUTCMonth() + n);
    return d.toISOString().slice(0, 10);
  }
  for (var i = 1; i <= maxPeriods && rem > 0.005; i++){
    var interest = roundMoney(rem * rate, 2);
    var capital = roundMoney(l.scheduledPayment - interest, 2);
    if (capital <= 0) return { rows: [], note: "La mensualité saisie ne couvre pas les intérêts : échéancier impossible." };
    if (capital > rem) capital = rem;
    rem = roundMoney(rem - capital, 2);
    rows.push({ i: i, date: addPeriod(l.startDate, i), interest: interest, capital: capital, payment: roundMoney(capital + interest, 2), remaining: rem });
    if (rows.length >= 120) break;
  }
  return { rows: rows, note: null };
}

// ---------- Objectifs ----------
function objectiveProgress(o){
  var st = statsAt(Date.now());
  var now = new Date();
  var mStart = Date.parse(new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)));
  var f = flowsBetween(mStart, Date.now());
  var current = 0, dir = "up";
  if (o.type === "NET_WORTH") current = st.netWorth;
  else if (o.type === "PASSIVE_INCOME") current = f.passive;
  else if (o.type === "EMERGENCY_FUND") current = st.cashAll;
  else if (o.type === "DEBT_REDUCTION"){ current = st.totalLiabilities; dir = "down"; }
  else if (o.type === "INVESTMENT_CAPITAL") current = st.tradingValue;
  var range = o.targetAmount - o.startAmount;
  var pct = null;
  if (range !== 0){
    var raw = dir === "up" ? (current - o.startAmount) / range : (o.startAmount - current) / range;
    pct = roundMoney(Math.max(0, Math.min(100, raw * 100)), 1);
  }
  return {
    current: roundMoney(current, 2), pct: pct,
    achieved: dir === "up" ? current >= o.targetAmount : current <= o.targetAmount
  };
}

// ---------- Répartition des actifs (graphique) ----------
function allocationData(){
  var base = DB.settings.baseCurrency, now = Date.now();
  var out = {};
  var excluded = excludedAssetIds();
  var cash = 0, trading = 0;
  for (var i = 0; i < DB.accounts.length; i++){
    var a = DB.accounts[i];
    if (a.status !== "ACTIVE") continue;
    var r = rateFor(a.currency, now, true);
    if (r == null) continue;
    if (isTradingAccount(a)) trading += toBase(a.equity != null ? a.equity : balanceOf(a.id, now), r);
    else cash += toBase(balanceOf(a.id, now), r);
  }
  if (cash > 0) out["Liquidités"] = roundMoney(cash, 2);
  if (trading > 0) out["Comptes de trading"] = roundMoney(trading, 2);
  for (var j = 0; j < DB.assets.length; j++){
    var as = DB.assets[j];
    if (as.status !== "ACTIVE" || excluded[as.id]) continue;
    var v = assetValueAt(as.id, now);
    var amount = v ? v.value : assetCost(as);
    var dateISO = v ? v.date : (as.acquisitionDate || as.createdAt || "2000-01-01");
    var rv = rateFor(v ? (v.currency || as.currency) : as.currency, Date.parse(dateISO), true);
    if (rv == null) continue;
    var key = labelOf(ASSET_CATEGORIES, as.category);
    out[key] = roundMoney((out[key] || 0) + toBase(amount, rv), 2);
  }
  return Object.keys(out).map(function(k){ return { name: k, value: out[k] }; })
    .filter(function(x){ return x.value > 0; })
    .sort(function(a,b){ return b.value - a.value; });
}

// ---------- Rapports ----------
function reportMonthly(ym){
  var p = ym.split("-").map(Number);
  var fromTs = Date.parse(new Date(Date.UTC(p[0], p[1]-1, 1)));
  var toTs = Date.parse(new Date(Date.UTC(p[0], p[1], 0, 23, 59, 59)));
  var pf = Date.parse(new Date(Date.UTC(p[0], p[1]-2, 1)));
  var pt = Date.parse(new Date(Date.UTC(p[0], p[1]-1, 0, 23, 59, 59)));
  var st = statsAt(toTs);
  var sp = statsAt(pt);
  var f = flowsBetween(fromTs, toTs);
  var fp = flowsBetween(pf, pt);
  return {
    ym: ym, bilan: st, bilanPrev: sp, flows: f, flowsPrev: fp,
    deltas: {
      netWorth: roundMoney(st.netWorth - sp.netWorth, 2),
      income: roundMoney(f.income - fp.income, 2),
      expenses: roundMoney((f.expense + f.charges) - (fp.expense + fp.charges), 2)
    }
  };
}
function reportAnnual(year){
  var fromTs = Date.parse(new Date(Date.UTC(year, 0, 1)));
  var toTs = Math.min(Date.parse(new Date(Date.UTC(year, 11, 31, 23, 59, 59))), Date.now());
  var st0 = statsAt(fromTs);
  var st1 = statsAt(toTs);
  var f = flowsBetween(fromTs, toTs);
  var ser = monthlySeries(fromTs, toTs);
  var repaid = 0, interestPaid = 0;
  for (var i = 0; i < DB.payments.length; i++){
    var p = DB.payments[i];
    var ts = Date.parse(p.date);
    if (ts < fromTs || ts > toTs) continue;
    repaid += p.capital; interestPaid += p.interest + p.fees;
  }

var LS_KEY = "pwm-web-v1";
function normalizeDB(d){
  var b = blankDB();
  var out = Object.assign({}, b, d);
  out.settings = Object.assign({}, b.settings, d.settings || {});
  out.currencies = (d.currencies && d.currencies.length) ? d.currencies : b.currencies;
  ["rates","accounts","transactions","assets","valuations","liabilities","payments","objectives"].forEach(function(k){
    if (!Array.isArray(out[k])) out[k] = [];
  });
  return out;
}
function loadDB(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || !d.settings || !Array.isArray(d.accounts)) return null;
    return normalizeDB(d);
  } catch (e){ return null; }
}
function saveDB(){
  if (!DB) return;

}

var GH_KEY = "pwm-github-v1";

var ghLastPushAt = (function(){ var l = ghLast(); return (l && l.ok && l.date) ? Date.parse(l.date) : 0; })();
function ghHeaders(){
  return { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + ghCfg.token, "X-GitHub-Api-Version": "2022-11-28" };
}
function ghUrl(){ return "https://api.github.com/repos/" + encodeURIComponent(ghCfg.owner) + "/" + encodeURIComponent(ghCfg.repo) + "/contents/" + (ghCfg.path || "pwm-backup.json"); }
function ghErrText(status, e){
  if (status === 401) return "Token invalide ou expiré (401). Régénérez votre Personal Access Token.";
  if (status === 403) return "Accès refusé (403) : le token doit avoir la permission « Contents : Read and write » sur ce dépôt.";
  if (status === 404) return "Introuvable (404) : vérifiez propriétaire, nom du dépôt et branche — et que le token accède à ce dépôt.";
  return "Erreur GitHub " + status + " : " + ((e && e.message) || "réponse inattendue");
}
function ghFetch(url, opts){
  return fetch(url, opts).catch(function(){
    throw new Error("Impossible de joindre api.github.com (hors ligne, réseau bloqué ou URL invalide).");
  });
}
function utf8ToBase64(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function ghPush(message){
  if (!ghCfg.token || !ghCfg.owner || !ghCfg.repo)
    return Promise.reject(new Error("Configuration GitHub incomplète : token, propriétaire et dépôt sont requis."));
  var payload = JSON.stringify({ app: "Personal Wealth Manager (web)", version: 1, exportedAt: new Date().toISOString(), data: DB }, null, 2);
  var body = { message: message || "Sauvegarde PWM", content: utf8ToBase64(payload), branch: ghCfg.branch || "main" };
  return ghFetch(ghUrl(), { headers: ghHeaders() }).then(function(r){
    if (r.status === 200) return r.json();
    if (r.status === 404) return null;
    return r.json().then(function(e){ throw new Error(ghErrText(r.status, e)); });
  }).then(function(meta){
    if (meta && meta.sha) body.sha = meta.sha;
    return ghFetch(ghUrl(), { method: "PUT", headers: ghHeaders(), body: JSON.stringify(body) }).then(function(r){
      if (r.ok) return r.json();
      return r.json().then(function(e){ throw new Error(ghErrText(r.status, e)); });
    });
  });
}
function ghPushDone(res){
  ghLastPushAt = Date.now();
  ghSetLast({ ok: true, date: new Date().toISOString(), url: res && res.commit ? res.commit.html_url : null });
  updateGhStatus();
}
function ghPushFail(e){
  ghSetLast({ ok: false, date: new Date().toISOString(), error: String(e && e.message || e) });
  updateGhStatus();
}
function ghTest(){
  if (!ghCfg.token || !ghCfg.owner || !ghCfg.repo) return Promise.reject(new Error("Renseignez d'abord le token, le propriétaire et le dépôt."));
  return ghFetch("https://api.github.com/repos/" + encodeURIComponent(ghCfg.owner) + "/" + encodeURIComponent(ghCfg.repo), { headers: ghHeaders() })
    .then(function(r){
      if (r.ok) return r.json();
      return r.json().then(function(e){ throw new Error(ghErrText(r.status, e)); });
    });
}
function ghRestore(){
  if (!ghCfg.token || !ghCfg.owner || !ghCfg.repo) return Promise.reject(new Error("Configuration GitHub incomplète."));
  return ghFetch(ghUrl(), { headers: Object.assign({}, ghHeaders(), { "Accept": "application/vnd.github.raw" }) }).then(function(r){
    if (r.status === 404) throw new Error("Aucune sauvegarde trouvée à cet emplacement (404). Envoyez d'abord une sauvegarde.");
    if (!r.ok) return r.json().then(function(e){ throw new Error(ghErrText(r.status, e)); });
    return r.text();
  }).then(function(text){
    var parsed;
    try { parsed = JSON.parse(text); } catch (e){ throw new Error("Le fichier distant n'est pas un JSON valide."); }
    var d = parsed && parsed.data ? parsed.data : parsed;
    if (!d || !d.settings || !Array.isArray(d.accounts)) throw new Error("Le fichier distant n'est pas une sauvegarde PWM valide.");
    if (!confirm("Restaurer la sauvegarde GitHub (" + d.accounts.length + " comptes, " + (d.transactions || []).length + " opérations) ?\n\nLes données locales actuelles seront REMPLACÉES (un instantané local sera créé avant).")) return "annulé";
    pushSnapshot();
    DB = normalizeDB(d);
    saveDB(); showPage("dashboard");
    return "restaurée";
  });
}
var ghTimer = null;
function maybeAutoPush(){
  if (!ghCfg.auto || !ghCfg.token || !ghCfg.owner || !ghCfg.repo) return;
  if (ghTimer) clearTimeout(ghTimer);
  ghTimer = setTimeout(function(){
    ghTimer = null;
    if (Date.now() - ghLastPushAt < 5 * 60 * 1000) return;
    ghPush("Sauvegarde automatique PWM — " + new Date().toLocaleString("fr-FR"))
      .then(function(res){ ghPushDone(res); })
      .catch(function(e){ ghPushFail(e); });

// ---------- Aides d'affichage ----------
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function fmtMoney(v, currency, d){
  d = d == null ? 2 : d;
  if (v == null || !isFinite(v)) return "—";
  var sign = v < 0 ? "−" : "";
  return sign + Math.abs(v).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }) + (currency ? " " + currency : "");
}
function fmtCompact(v, currency){
  if (v == null || !isFinite(v)) return "—";
  var abs = Math.abs(v), out;
  if (abs >= 1e9) out = (v / 1e9).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " Md";
  else if (abs >= 1e6) out = (v / 1e6).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " M";
  else if (abs >= 1e4) out = (v / 1e3).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " k";
  else out = v.toLocaleString("fr-FR", { maximumFractionDigits: 0 });
  return out + (currency ? " " + currency : "");
}
function fmtPct(v, d){
  d = d == null ? 1 : d;
  if (v == null || !isFinite(v)) return "—";
  return (v >= 0 ? "" : "−") + Math.abs(v).toFixed(d) + " %";
}
function fmtDate(s){
  if (!s) return "—";
  var d = new Date(s);
  return isNaN(d.getTime()) ? "—" : d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}
function todayISO(){ return new Date().toISOString().slice(0, 10); }
function toast(msg, tone){
  var root = document.getElementById("toastRoot");
  var el = document.createElement("div");
  el.className = "alert " + (tone === "err" ? "a-err" : "a-ok");
  el.style.marginTop = "8px";
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 4200);
}
function download(filename, content, mime){
  var blob = new Blob([content], { type: mime || "application/octet-stream" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
}
function csvCell(v){
  var s = v == null ? "" : String(v);
  return /[",;\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(filename, rows){
  var csv = "\uFEFF" + rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n");
  download(filename, csv, "text/csv;charset=utf-8");
}

// ---------- Graphiques SVG (sans dépendance) ----------
var CHART_COLORS = ["#4f46e5","#059669","#d97706","#dc2626","#0891b2","#7c3aed","#db2777","#65a30d","#ea580c","#0d9488","#6366f1","#f59e0b"];
function compactNum(v){
  var abs = Math.abs(v);
  if (abs >= 1e9) return (v / 1e9).toFixed(1).replace(".0","") + "Md";
  if (abs >= 1e6) return (v / 1e6).toFixed(1).replace(".0","") + "M";
  if (abs >= 1e3) return Math.round(v / 1e3) + "k";
  return String(Math.round(v));
}
function chartLine(data, series, opts){
  opts = opts || {};
  var h = opts.h || 230, W = 640, H = h;
  var padL = 56, padR = 10, padT = 12, padB = 24;
  var vals = [];
  data.forEach(function(d){ series.forEach(function(s){ var v = d[s.key]; if (v != null && isFinite(v)) vals.push(v); }); });
  if (!vals.length) return '<p class="empty">Aucune donnée sur la période sélectionnée.</p>';
  var min = Math.min(0, Math.min.apply(null, vals)), max = Math.max(0, Math.max.apply(null, vals));
  if (max === min) max = min + 1;
  var pad = (max - min) * 0.08; max += pad; if (min < 0) min -= pad;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  function y(v){ return padT + plotH - (v - min) / (max - min) * plotH; }
  function x(i){ return padL + (data.length === 1 ? plotW / 2 : i / (data.length - 1) * plotW); }
  var g = "";
  for (var t = 0; t <= 4; t++){
    var v = min + (max - min) * t / 4;
    g += '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) + '" stroke="#eef0f4"/>' +
      '<text x="' + (padL - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end" font-size="10" fill="#64708a">' + compactNum(v) + "</text>";
  }
  var step = Math.ceil(data.length / 7);
  data.forEach(function(d, i){
    if (i % step === 0 || i === data.length - 1)
      g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#64708a">' + esc(monthLabelFr(d.label)) + "</text>";
  });
  series.forEach(function(s, si){
    var color = s.color || CHART_COLORS[si % CHART_COLORS.length];
    var segs = [], cur = [];
    data.forEach(function(d, i){
      var v = d[s.key];
      if (v != null && isFinite(v)) cur.push([x(i), y(v), v, d.label]);
      else if (cur.length){ segs.push(cur); cur = []; }
    });
    if (cur.length) segs.push(cur);
    segs.forEach(function(seg){
      var path = seg.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
      if (opts.area && si === 0 && seg.length > 1)
        g += '<path d="' + path + " L" + seg[seg.length-1][0].toFixed(1) + " " + y(min) + " L" + seg[0][0].toFixed(1) + " " + y(min) + ' Z" fill="' + color + '" opacity="0.12"/>';
      g += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2"/>';
      seg.forEach(function(p){
        g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.5" fill="#fff" stroke="' + color + '" stroke-width="1.5"><title>' +
          esc(monthLabelFr(p[3])) + " — " + s.name + " : " + fmtMoney(p[2], "") + "</title></circle>";
      });
    });
  });
  var legend = '<div class="legend">' + series.map(function(s, si){
    return '<span><i style="background:' + (s.color || CHART_COLORS[si % CHART_COLORS.length]) + '"></i>' + esc(s.name) + "</span>";
  }).join("") + "</div>";
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img">' + g + "</svg>" + legend;
}
function chartBars(data, series, opts){
  opts = opts || {};
  var h = opts.h || 230, W = 640, H = h;
  var padL = 56, padR = 10, padT = 12, padB = 24;
  var vals = [];
  data.forEach(function(d){ series.forEach(function(s){ var v = d[s.key]; if (v != null && isFinite(v)) vals.push(v); }); });
  if (!vals.length) return '<p class="empty">Aucune donnée sur la période sélectionnée.</p>';
  var max = Math.max(0, Math.max.apply(null, vals)) * 1.08;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  function y(v){ return padT + plotH - v / max * plotH; }
  var g = "";
  for (var t = 0; t <= 4; t++){
    var v = max * t / 4;
    g += '<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (W - padR) + '" y2="' + y(v) + '" stroke="#eef0f4"/>' +
      '<text x="' + (padL - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end" font-size="10" fill="#64708a">' + compactNum(v) + "</text>";
  }
  var n = data.length, groupW = plotW / n;
  var barW = Math.min(26, groupW * 0.7 / series.length);
  data.forEach(function(d, i){
    var cx = padL + groupW * (i + 0.5);
    if (i % Math.ceil(n / 7) === 0 || i === n - 1)
      g += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#64708a">' + esc(monthLabelFr(d.label)) + "</text>";
    series.forEach(function(s, si){
      var v = d[s.key];
      if (v == null || !isFinite(v)) return;
      var color = s.color || CHART_COLORS[si % CHART_COLORS.length];
      var bx = cx - barW * series.length / 2 + barW * si;
      g += '<rect x="' + bx.toFixed(1) + '" y="' + y(v).toFixed(1) + '" width="' + (barW - 2).toFixed(1) + '" height="' + (plotH + padT - y(v)).toFixed(1) + '" rx="3" fill="' + color + '"><title>' +
        esc(monthLabelFr(d.label)) + " — " + s.name + " : " + fmtMoney(v, "") + "</title></rect>";
    });
  });
  var legend = '<div class="legend">' + series.map(function(s, si){
    return '<span><i style="background:' + (s.color || CHART_COLORS[si % CHART_COLORS.length]) + '"></i>' + esc(s.name) + "</span>";
  }).join("") + "</div>";
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img">' + g + "</svg>" + legend;
}
function chartPie(items){
  var filtered = items.filter(function(x){ return x.value > 0; });
  if (!filtered.length) return '<p class="empty">Aucune donnée à répartir.</p>';
  var total = sumArr(filtered.map(function(x){ return x.value; }));
  var R = 74, C = 2 * Math.PI * R, acc = 0;
  var W = 320, H = 190, cx = 95, cy = 95;
  var g = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="#eef0f4" stroke-width="34"/>';
  filtered.forEach(function(it, i){
    var len = it.value / total * C;
    var color = CHART_COLORS[i % CHART_COLORS.length];
    g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="34" stroke-dasharray="' + len.toFixed(2) + " " + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 ' + cx + " " + cy + ')"><title>' + esc(it.name) + " : " + fmtCompact(it.value, "") + "</title></circle>";
    acc += len;
  });
  var legend = filtered.map(function(it, i){
    var pct = total ? (it.value / total * 100).toFixed(1) : "0";
    return '<span style="min-width:45%"><i style="background:' + CHART_COLORS[i % CHART_COLORS.length] + '"></i>' + esc(it.name) + " · " + fmtCompact(it.value, "") + " (" + pct + " %)</span>";
  }).join("");
  return '<svg class="chart" style="max-width:340px;margin:0 auto;display:block" viewBox="0 0 ' + W + " " + H + '" role="img">' + g + "</svg>" + '<div class="legend">' + legend + "</div>";
}

function openAccountModal(existing){
  var e = existing || {};
  var body = '<div class="frow">' +
    fInput("name", "Nom du compte", "text", e.name, { required: true, placeholder: "Ex. Compte courant Ecobank" }) +
    fInput("institution", "Institution", "text", e.institution, { placeholder: "Ex. Ecobank, Orange Money…" }) +
    fSelect("type", "Type", ACCOUNT_TYPES.map(function(t){ return { v: t[0], l: t[1] }; }), e.type || "BANK") +
    fSelect("currency", "Devise", DB.currencies.map(function(c){ return { v: c.code, l: c.code + " — " + c.name }; }), e.currency || DB.settings.baseCurrency) +
    fInput("initialBalance", "Solde initial", "number", e.initialBalance != null ? e.initialBalance : 0, { step: "any", hint: "Peut être négatif (découvert)." }) +
    (existing ? fSelect("status", "Statut", [{ v: "ACTIVE", l: "Actif" }, { v: "ARCHIVED", l: "Archivé" }, { v: "CLOSED", l: "Clôturé" }], e.status) : "") +
    "</div>" + fTextarea("notes", "Notes", e.notes);

    { label: "Annuler", variant: "s", onClick: closeModal },

      };
      if (existing){

        DB.accounts.push(Object.assign({
          id: uid(), equity: null, equityNote: null, equityHistory: [], status: "ACTIVE", createdAt: todayISO()
        }, data));
        toast("Compte créé.");
      }
      saveDB(); closeModal(); rerender();
    }}
  ]);
}

function openTransferModal(){
  var accs = activeAccounts();
  if (accs.length < 2){ toast("Il faut au moins deux comptes actifs pour un transfert.", "err"); return; }
  var opts = accs.map(function(a){ return { v: a.id, l: a.name + " (" + a.currency + ")" }; });
  var body = '<div id="xferBody"><div class="frow">' +
    fSelect("from", "Compte débité", opts, accs[0].id, { required: true }) +
    fSelect("to", "Compte crédité", opts, accs[1].id, { required: true }) +
    fInput("amount", "Montant débité", "number", "", { step: "any", required: true }) +
    '<div id="toAmountWrap" style="display:none">' + fInput("toAmount", "Montant crédité", "number", "", { step: "any", required: true, hint: "Conversion manuelle entre devises différentes." }) + "</div>" +
    fInput("date", "Date", "date", todayISO(), { required: true }) +
    "</div>" + fTextarea("notes", "Notes", "") +
    '<p class="note" id="xferNote">Le transfert est neutre : ni revenu, ni dépense, ni gain.</p></div>';
  openModal("Transfert entre comptes", body, { wide: true });
  function refresh(){
    var from = accountById(gv("from")), to = accountById(gv("to"));
    var cross = from && to && from.currency !== to.currency;
    document.getElementById("toAmountWrap").style.display = cross ? "" : "none";
    var n = document.getElementById("xferNote");
    n.textContent = "Le transfert est neutre : ni revenu, ni dépense, ni gain.";
  }
  document.getElementById("f_from").onchange = refresh;
  document.getElementById("f_to").onchange = refresh;
  refresh();
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: "Enregistrer le transfert", onClick: function(){
      var from = accountById(gv("from")), to = accountById(gv("to"));
      var amount = gn("amount"), toAmount = gv("toAmount") ? gn("toAmount") : null;
      if (!from || !to){ toast("Choisissez les deux comptes.", "err"); return; }
      if (from.id === to.id){ toast("Les comptes doivent être différents.", "err"); return; }
      if (!(amount > 0)){ toast("Montant invalide.", "err"); return; }
      if (from.currency !== to.currency && !(toAmount > 0)){ toast("Saisissez le montant crédité (devises différentes).", "err"); return; }
      var rate = from.currency === to.currency ? 1 : toAmount / amount;
      var baseRate = rateFor(from.currency, Date.parse(gv("date")), false);
      if (baseRate == null){ toast("Aucun taux connu pour " + from.currency + ". Ajoutez-le dans Paramètres → Taux.", "err"); return; }
      DB.transactions.push({
        id: uid(), type: "TRANSFER",
        label: gv("notes") ? "[Transfert] " + gv("notes").slice(0, 60) : "Transfert " + from.name + " → " + to.name,
        amount: amount, currency: from.currency, rateApplied: rate, amountBase: toBase(amount, baseRate),
        date: gv("date"), category: null, subCategory: null, frequency: "ONE_TIME", status: "CONFIRMED",
        accountId: from.id, toAccountId: to.id, toAmount: (from.currency === to.currency ? null : toAmount), toCurrency: (from.currency === to.currency ? null : to.currency),
        assetId: null, notes: gv("notes") || null
      });
      saveDB(); closeModal(); rerender();
      toast("Transfert enregistré (neutre pour revenus et dépenses).");
    }}
  ]);
}

    '<div class="frow">' + fInput("newBalance", "Nouveau solde constaté (" + acc.currency + ")", "number", "", { step: "any", required: true }) +

    { label: "Annuler", variant: "s", onClick: closeModal },

      DB.transactions.push({
        id: uid(), type: "ADJUSTMENT", label: "[Rapprochement] " + notes.slice(0, 70),
        amount: delta, currency: acc.currency, rateApplied: rate, amountBase: toBase(delta, rate),
        date: gv("date"), category: null, subCategory: null, frequency: "ONE_TIME", status: "CONFIRMED",

      saveDB(); closeModal(); rerender();

function openEquityModal(acc){

function openTxModal(type, existing, presetAssetId){
  var isTransfer = type === "TRANSFER", isEdit = !!existing;
  if (isEdit){ type = existing.type; isTransfer = type === "TRANSFER"; }
  var accs = activeAccounts();
  var accOpts = accs.map(function(a){ return { v: a.id, l: a.name + " (" + a.currency + ")" }; });
  if (!accOpts.length){ toast("Créez d'abord un compte actif.", "err"); return; }
  var assetOpts = [{ v: "", l: "— Aucun —" }].concat(DB.assets.filter(function(a){ return a.status === "ACTIVE"; }).map(function(a){ return { v: a.id, l: a.name }; }));
  var body = "";
  if (!isTransfer){
    var cats = (type === "INCOME" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map(function(c){ return { v: c[0], l: c[1] }; });
    body += '<div class="frow">' +
      fSelect("accountId", type === "INCOME" ? "Compte destinataire" : "Compte utilisé", accOpts, existing ? existing.accountId : accs[0].id, { required: true, hint: "La devise de l'opération est celle du compte." }) +
      fInput("amount", "Montant", "number", existing ? existing.amount : "", { step: "any", required: true, hint: type === "ADJUSTMENT" ? "Delta signé : + pour corriger vers le haut, − vers le bas." : null }) +
      fInput("date", "Date", "date", existing ? existing.date : todayISO(), { required: true }) +
      (type !== "ADJUSTMENT" ? fSelect("category", "Catégorie", cats, existing ? existing.category : "", { required: true }) : "") +
      (type !== "ADJUSTMENT" ? fInput("subCategory", "Sous-catégorie", "text", existing ? existing.subCategory : "", { placeholder: "Ex. essence, loyer bureau…" }) : "") +
      (type !== "ADJUSTMENT" ? fSelect("status", "Statut", [{ v: "CONFIRMED", l: "Confirmé" }, { v: "EXPECTED", l: "Attendu" }, { v: "CANCELLED", l: "Annulé" }], existing ? existing.status : "CONFIRMED", { hint: "Les revenus « attendus » ne sont pas comptés comme encaissés." }) : "") +
      (type !== "ADJUSTMENT" ? fSelect("frequency", "Fréquence", [["ONE_TIME","Ponctuel"],["WEEKLY","Hebdomadaire"],["MONTHLY","Mensuel"],["QUARTERLY","Trimestriel"],["ANNUAL","Annuel"]].map(function(f){ return { v: f[0], l: f[1] }; }), existing ? existing.frequency : "ONE_TIME") : "") +
      "</div>" +
      fSelect("assetId", "Actif associé (optionnel)", assetOpts, existing ? existing.assetId : (presetAssetId || ""), { hint: "Lier l'opération à un actif pour analyser sa rentabilité." }) +
      fInput("label", "Libellé", "text", existing ? existing.label : "", { required: true, placeholder: "Ex. Salaire novembre, Loyer boutique…" }) +
      fTextarea("notes", "Notes" + (type === "ADJUSTMENT" ? " *" : ""), existing ? existing.notes : "", type === "ADJUSTMENT" ? { hint: "Obligatoire pour un ajustement de solde." } : {});
  } else {
    var opts2 = accs.map(function(a){ return { v: a.id, l: a.name + " (" + a.currency + ")" }; });
    body += '<div class="frow">' +
      fSelect("accountId", "Compte débité", opts2, accs[0].id, { required: true }) +
      fSelect("toAccountId", "Compte crédité", opts2, accs[Math.min(1, accs.length-1)].id, { required: true }) +
      fInput("amount", "Montant débité", "number", "", { step: "any", required: true }) +
      '<div id="toAmountWrap" style="display:none">' + fInput("toAmount", "Montant crédité", "number", "", { step: "any", required: true }) + "</div>" +
      fInput("date", "Date", "date", todayISO(), { required: true }) +
      "</div>" + fInput("label", "Libellé", "text", "", { placeholder: "Ex. Dépôt trading, Retrait gains…" });
  }
  openModal(isEdit ? "Modifier l'opération" : (isTransfer ? "Transfert entre comptes" : (type === "INCOME" ? "Nouveau revenu" : type === "EXPENSE" ? "Nouvelle dépense" : "Ajustement de solde")), body, { wide: true });
  function refreshXfer(){
    var from = accountById(gv("accountId")), to = accountById(gv("toAccountId"));
    var wrap = document.getElementById("toAmountWrap");
    if (wrap) wrap.style.display = (from && to && from.currency !== to.currency) ? "" : "none";
  }
  if (isTransfer){
    document.getElementById("f_accountId").onchange = refreshXfer;
    document.getElementById("f_toAccountId").onchange = refreshXfer;
    refreshXfer();
  }
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: isEdit ? "Enregistrer" : "Enregistrer l'opération", onClick: function(){
      if (isTransfer){
        var from = accountById(gv("accountId")), to = accountById(gv("toAccountId"));
        var amount = gn("amount"), toAmount = gv("toAmount") ? gn("toAmount") : null;
        if (!from || !to || from.id === to.id){ toast("Choisissez deux comptes différents.", "err"); return; }
        if (!(amount > 0)){ toast("Montant invalide.", "err"); return; }
        if (from.currency !== to.currency && !(toAmount > 0)){ toast("Saisissez le montant crédité (devises différentes).", "err"); return; }
        var rate = from.currency === to.currency ? 1 : toAmount / amount;
        var baseRate = rateFor(from.currency, Date.parse(gv("date")), false);
        if (baseRate == null){ toast("Aucun taux connu pour " + from.currency + ". Ajoutez-le dans Paramètres.", "err"); return; }
        DB.transactions.push({
          id: uid(), type: "TRANSFER", label: gv("label") || "Transfert",
          amount: amount, currency: from.currency, rateApplied: rate, amountBase: toBase(amount, baseRate),
          date: gv("date"), category: null, subCategory: null, frequency: "ONE_TIME", status: "CONFIRMED",
          accountId: from.id, toAccountId: to.id, toAmount: from.currency === to.currency ? null : toAmount, toCurrency: from.currency === to.currency ? null : to.currency,
          assetId: null, notes: null
        });
        saveDB(); closeModal(); rerender();
        toast("Transfert enregistré (neutre).");
        return;
      }
      var acc = accountById(gv("accountId"));
      if (!acc){ toast("Compte introuvable.", "err"); return; }
      var amount = gn("amount");
      if (!isFinite(amount) || (type === "ADJUSTMENT" ? amount === 0 : amount <= 0)){ toast(type === "ADJUSTMENT" ? "Le delta ne peut pas être nul." : "Le montant doit être positif.", "err"); return; }
      var notes = gv("notes");
      if (type === "ADJUSTMENT" && !notes){ toast("Un ajustement doit être documenté (notes obligatoires).", "err"); return; }
      var date = gv("date") || todayISO();
      var rate = rateFor(acc.currency, Date.parse(date), false);
      if (rate == null){ toast("Aucun taux connu pour " + acc.currency + ". Ajoutez-le dans Paramètres → Taux.", "err"); return; }
      var data = {
        type: type,
        label: gv("label") || (type === "INCOME" ? "Revenu" : type === "EXPENSE" ? "Dépense" : "Ajustement de solde"),
        amount: amount, currency: acc.currency, rateApplied: rate, amountBase: toBase(amount, rate),
        date: date, category: type === "ADJUSTMENT" ? null : gv("category") || null,
        subCategory: type === "ADJUSTMENT" ? null : gv("subCategory") || null,
        frequency: type === "ADJUSTMENT" ? "ONE_TIME" : gv("frequency") || "ONE_TIME",
        status: type === "ADJUSTMENT" ? "CONFIRMED" : gv("status") || "CONFIRMED",
        accountId: acc.id, assetId: gv("assetId") || null,
        notes: notes || null
      };
      if (isEdit && existing){
        Object.assign(existing, data);
        toast("Opération mise à jour.");
      } else {
        data.id = uid(); data.toAccountId = null; data.toAmount = null; data.toCurrency = null;
        DB.transactions.push(data);
        toast("Opération enregistrée.");
      }
      saveDB(); closeModal(); rerender();
    }}
  ]);
}

var dashState = { period: "12m" };
function firstActivityTs(){
  var ts = Date.now();
  DB.transactions.forEach(function(t){ var d = Date.parse(t.date); if (d < ts) ts = d; });
  DB.accounts.forEach(function(a){ var d = Date.parse(a.createdAt || "2000-01-01"); if (d < ts) ts = d; });
  DB.assets.forEach(function(a){ var d = Date.parse(a.acquisitionDate || a.createdAt || "2000-01-01"); if (d < ts) ts = d; });
  DB.liabilities.forEach(function(l){ var d = Date.parse(l.startDate); if (d < ts) ts = d; });
  return ts;
}
function kpi(l, v, s, tone){
  return '<div class="kpi"><div class="l">' + l + '</div><div class="v ' + (tone || "") + '">' + v + "</div>" + (s ? '<div class="s">' + s + "</div>" : "") + "</div>";
}

var assetFilter = "ACTIVE";
RENDER.assets = function(){
  var sec = document.getElementById("page-assets");
  var aa = assetAnalytics().filter(function(x){
    var a = DB.assets.find(function(y){ return y.id === x.id; });
    return a && a.status === assetFilter;
  });
  var totValue = sumArr(aa.map(function(x){ return x.valueBase != null ? x.valueBase : x.cost; }));
  var totCost = sumArr(aa.map(function(x){ return x.cost; }));
  var totIn = sumArr(aa.map(function(x){ return x.cumIn; }));
  var totOut = sumArr(aa.map(function(x){ return x.cumOut; }));
  var rows = "";
  aa.forEach(function(x){
    rows += "<tr><td><b>" + esc(x.name) + "</b>" + (x.missing ? ' <span class="badge b-amber">sans valorisation</span>' : "") + "</td>" +
      "<td>" + labelOf(ASSET_CATEGORIES, x.category) + "</td>" +
      '<td class="r nowrap">' + fmtMoney(x.cost, x.currency, 0) + "</td>" +
      '<td class="r nowrap"><b>' + (x.value == null ? "—" : fmtMoney(x.value, x.currency, 0)) + "</b></td>" +
      '<td class="r nowrap ' + (x.gain != null && x.gain >= 0 ? "pos" : "neg") + '">' + (x.gain == null ? "—" : fmtMoney(x.gain, x.currency, 0) + ' <span class="note" style="display:inline">' + fmtPct(x.gainPct) + "</span>") + "</td>" +
      '<td class="r">' + fmtPct(x.netYield) + '</td><td class="r pos">' + fmtMoney(x.cumIn, "", 0) + '</td><td class="r neg">' + fmtMoney(x.cumOut, "", 0) + "</td>" +
      '<td><button class="link" data-id="' + x.id + '">Fiche →</button></td></tr>';
  });
  if (!aa.length) rows = '<tr><td colspan="9"><div class="empty">Aucun actif' + (assetFilter === "ACTIVE" ? ". Créez la fiche de votre premier actif (immobilier, véhicule, actions…)." : " pour ce statut.") + "</div></td></tr>";
  sec.innerHTML =
    '<div class="kpis">' +
    kpi("Valeur actuelle", fmtCompact(totValue, DB.settings.baseCurrency), "Devise de base") +
    kpi("Coût d'acquisition", fmtCompact(totCost, DB.settings.baseCurrency), "Prix + frais") +
    kpi("Revenus cumulés", fmtCompact(totIn, DB.settings.baseCurrency), "Liés aux actifs", "pos") +
    kpi("Charges cumulées", fmtCompact(totOut, DB.settings.baseCurrency), "Liées aux actifs", "neg") +
    "</div>" +
    '<div class="card"><div class="card-h"><div><h3>Actifs</h3><div class="sub">Fiche individuelle : acquisition, valorisation historique, revenus, charges, classifications économiques indépendantes.</div></div>' +
    '<div class="row-actions"><select id="assetFilter" style="width:auto">' +
    [["ACTIVE","Actifs"],["SOLD","Vendus"],["ARCHIVED","Archivés"]].map(function(o){ return '<option value="' + o[0] + '"' + (assetFilter === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") +
    '</select><button class="btn btn-p" id="btnAddAsset">+ Actif</button></div></div>' +
    '<div class="card-b"><div class="tw"><table><thead><tr><th>Actif</th><th>Catégorie</th><th class="r">Coût acq.</th><th class="r">Valeur</th><th class="r">± latente</th><th class="r">Rend. net</th><th class="r">Rev. cum.</th><th class="r">Charges cum.</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<p class="note">Un même bien peut être productif ET prendre de la valeur : les classifications sont indépendantes. Chaque réévaluation crée une nouvelle entrée d\'historique.</p></div></div>';
  document.getElementById("assetFilter").onchange = function(e){ assetFilter = e.target.value; RENDER.assets(); };
  document.getElementById("btnAddAsset").onclick = function(){ openAssetModal(null); };

function openAssetModal(existing){
  var e = existing || {};
  var accOpts = [{ v: "", l: "—" }].concat(activeAccounts().map(function(a){ return { v: a.id, l: a.name }; }));
  var body = '<div class="frow">' +
    fInput("name", "Nom", "text", e.name, { required: true, placeholder: "Ex. Appartement Bastos" }) +
    fSelect("category", "Catégorie", ASSET_CATEGORIES.map(function(c){ return { v: c[0], l: c[1] }; }), e.category || "REAL_ESTATE") +
    fInput("subCategory", "Sous-catégorie", "text", e.subCategory, { placeholder: "Ex. 3 pièces, Toyota Hilux…" }) +
    fInput("acquisitionDate", "Date d'acquisition", "date", e.acquisitionDate || todayISO()) +
    fInput("purchasePrice", "Prix d'achat", "number", e.purchasePrice != null ? e.purchasePrice : "", { step: "any", required: true }) +
    fSelect("currency", "Devise", DB.currencies.map(function(c){ return { v: c.code, l: c.code }; }), e.currency || DB.settings.baseCurrency) +
    fInput("fees", "Frais d'acquisition", "number", e.fees != null ? e.fees : 0, { step: "any", hint: "Notaire, courtage, taxes…" }) +
    (existing ? "" : fInput("initialValue", "Valeur actuelle initiale (optionnel)", "number", "", { step: "any" })) +
    fSelect("financingMode", "Financement", [["CASH","Fonds propres"],["LOAN","Crédit"],["MIXED","Mixte"]].map(function(f){ return { v: f[0], l: f[1] }; }), e.financingMode || "CASH") +
    fSelect("accountId", "Compte rattaché (optionnel)", accOpts, e.accountId || "", { hint: "Si l'actif vit dans un compte trading dont vous saisissez l'equity, il ne sera pas compté deux fois." }) +
    "</div>" +
    '<div class="section-title">Classification économique (dimensions indépendantes)</div><div class="frow">' +
    fSelect("isProductive", "Productif ?", [{ v: "0", l: "Non productif" }, { v: "1", l: "Productif" }], e.isProductive ? "1" : "0") +
    fSelect("incomeGenerating", "Trésorerie", [["GENERATES","Génère des revenus"],["CONSUMES","Consomme de la trésorerie"],["NEUTRAL","Neutre"]].map(function(f){ return { v: f[0], l: f[1] }; }), e.incomeGenerating || "NEUTRAL") +
    fSelect("appreciation", "Tendance de valeur", [["APPRECIATING","Prend de la valeur"],["DEPRECIATING","Perd de la valeur"],["STABLE","Stable"],["UNKNOWN","Inconnue"]].map(function(f){ return { v: f[0], l: f[1] }; }), e.appreciation || "UNKNOWN") +
    fSelect("liquidity", "Liquidité", [["LIQUID","Liquide"],["SEMI_LIQUID","Semi-liquide"],["ILLIQUID","Illiquide"]].map(function(f){ return { v: f[0], l: f[1] }; }), e.liquidity || "ILLIQUID") +
    fSelect("role", "Rôle", [{ v: "PERSONAL", l: "Bien personnel" }, { v: "INVESTMENT", l: "Investissement" }], e.role || "PERSONAL") +
    fInput("expectedIncome", "Revenu attendu (prévisionnel)", "number", e.expectedIncome != null ? e.expectedIncome : "", { step: "any" }) +
    fSelect("incomeFrequency", "Fréquence du revenu attendu", [["MONTHLY","Mensuel"],["WEEKLY","Hebdomadaire"],["QUARTERLY","Trimestriel"],["ANNUAL","Annuel"]].map(function(f){ return { v: f[0], l: f[1] }; }), e.incomeFrequency || "MONTHLY") +
    "</div>" + fTextarea("notes", "Description / notes", e.notes);
  openModal(existing ? "Modifier l'actif" : "Nouvel actif", body, { wide: true });
  modalFooter([
    { label: "Annuler", variant: "s", onClick: closeModal },
    { label: existing ? "Enregistrer" : "Créer l'actif", onClick: function(){
      var name = gv("name");
      if (!name){ toast("Le nom est requis.", "err"); return; }
      var purchasePrice = gn("purchasePrice") || 0;
      if (!(purchasePrice >= 0) || (purchasePrice === 0 && !existing)){ toast("Prix d'achat requis.", "err"); return; }
      var currency = gv("currency");
      var acqDate = gv("acquisitionDate") || todayISO();
      var rate = rateFor(currency, Date.parse(acqDate), false);
      if (rate == null){ toast("Aucun taux connu pour " + currency + ". Ajoutez-le dans Paramètres → Taux.", "err"); return; }
      var data = {
        name: name, category: gv("category"), subCategory: gv("subCategory") || null,
        acquisitionDate: acqDate, purchasePrice: purchasePrice, fees: gn("fees") || 0, currency: currency,
        financingMode: gv("financingMode"), accountId: gv("accountId") || null,
        isProductive: gv("isProductive") === "1", incomeGenerating: gv("incomeGenerating"),
        appreciation: gv("appreciation"), liquidity: gv("liquidity"), role: gv("role"),
        expectedIncome: gv("expectedIncome") ? gn("expectedIncome") : null,
        incomeFrequency: gv("expectedIncome") ? gv("incomeFrequency") : null,
        notes: gv("notes") || null
      };
      if (existing){
        Object.assign(existing, data);
        toast("Actif mis à jour.");
      } else {
        var asset = Object.assign({ id: uid(), description: null, status: "ACTIVE", createdAt: todayISO() }, data);
        DB.assets.push(asset);
        var iv = gv("initialValue");
        if (iv && isFinite(gn("initialValue"))){
          DB.valuations.push({ id: uid(), assetId: asset.id, date: acqDate, value: gn("initialValue"), currency: currency, rateApplied: rate, valueBase: toBase(gn("initialValue"), rate), note: "Valorisation initiale" });
        }
        toast("Actif créé.");
      }
      saveDB(); closeModal(); rerender();
    }}
  ]);
}

  var txs = DB.transactions.filter(function(t){ return t.assetId === assetId; }).sort(function(x,y){ return Date.parse(y.date) - Date.parse(x.date); });

  var body =
    '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">' +

    kpi(an.gain != null && an.gain >= 0 ? "Plus-value latente" : "Moins-value latente", an.gain == null ? "—" : fmtMoney(an.gain, cur, 0), fmtPct(an.gainPct), an.gain != null && an.gain >= 0 ? "pos" : "neg") +

    kpi("Charges cumulées", fmtMoney(an.cumOut, "", 0), "", "neg") +
    kpi("Revenu net", fmtMoney(an.net, "", 0), "Coût de détention : " + fmtMoney(an.holdingCost, "", 0), an.net >= 0 ? "pos" : "neg") +
    kpi("Rendements (12 mois)", fmtPct(an.grossYield) + " brut", "Net : " + fmtPct(an.netYield)) +

    '<div class="chips" style="margin-bottom:10px">' +
